# Headless service — DNS: postgresql.fairtier-system.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  labels:
    app: postgresql
    tier: box
spec:
  selector:
    app: postgresql
    tier: box
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgresql
    # postgres_exporter sidecar. The box Alloy scrapes the POD IP directly
    # (no prometheus-operator on a box), so this port exists for manual
    # `kubectl port-forward svc/postgresql 9187` debugging.
    - port: 9187
      targetPort: 9187
      protocol: TCP
      name: metrics
  clusterIP: None
  type: ClusterIP
