# Applies the workspace-db migrations on every ArgoCD sync (idempotent —
# golang-migrate tracks applied versions in schema_migrations inside the
# `workspace` database). Same day-2 pattern as postgres-ensure-databases:
# a schema change reaches EXISTING boxes on the next ring-branch rollout.
#
# The ensure-databases Job (charts/postgres) creates the `workspace`
# database itself; the init container below waits until it exists, so
# first-boot ordering self-heals across the two Applications.
apiVersion: batch/v1
kind: Job
metadata:
  name: workspace-db-migrate
  labels:
    app: workspace-db
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: workspace-db
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-database
          image: postgres:17-alpine
          command:
            - /bin/sh
            - -c
            - |
              until psql -h postgresql.fairtier-system.svc.cluster.local -U postgres \
                    -tAc "SELECT 1 FROM pg_database WHERE datname = 'workspace'" | grep -q 1; do
                echo "Waiting for the workspace database..."
                sleep 2
              done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: postgres-password
      containers:
        - name: migrate
          image: migrate/migrate:v4.18.1
          args:
            - -path
            - /migrations
            - -database
            - postgres://postgres:$(PGPASSWORD)@postgresql.fairtier-system.svc.cluster.local:5432/workspace?sslmode=disable
            - up
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  # Written by cloud-init into fairtier-system.
                  name: postgres-credentials
                  key: postgres-password
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: migrations
          configMap:
            name: workspace-db-migrations
