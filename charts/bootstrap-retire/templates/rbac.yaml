# RBAC for the retire Job/CronJob. Wave -2: must exist before the wave -1
# hook pod starts, or the very first sync deadlocks on a ServiceAccount a
# later wave would apply (same shape as the gitea seed).
#
# Read-only, and every rule is a GUARD lookup — the script never writes to
# the API, it writes one sentinel file on the host. `get` on Secrets is
# name-scoped to the single contract Secret used to prove cloud-init's
# bootstrap manifest was applied on this box.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bootstrap-retire
  namespace: kube-system
  labels:
    app: bootstrap-retire
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bootstrap-retire
  labels:
    app: bootstrap-retire
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  # Guard for fairtier-argocd.yaml: the GitOps twin that owns the release's
  # values (charts/argocd/templates/helmchartconfig.yaml).
  - apiGroups: ["helm.cattle.io"]
    resources: ["helmchartconfigs"]
    resourceNames: ["argo-cd"]
    verbs: ["get"]
  # Guard for fairtier-root-app.yaml: the self-managed root Application
  # (charts/root/templates/root-app.yaml) must have adopted it.
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["box-root"]
    verbs: ["get"]
  # Guards for fairtier-bootstrap.yaml: proof the file was applied on this
  # box at all. box-config is the newer of the two; postgres-credentials has
  # been in the contract since the first box.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["box-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["postgres-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bootstrap-retire
  labels:
    app: bootstrap-retire
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bootstrap-retire
subjects:
  - kind: ServiceAccount
    name: bootstrap-retire
    namespace: kube-system
