# Box-local seeding — the day-2-safe pattern (ARCHITECTURE.md, "Day-2
# changes"): the at-rest credential key is GENERATED ON THE BOX, so this
# app converges identically on new AND already-provisioned boxes and
# nothing here touches the (frozen) cloud-init contract.
#
# Step 1, create-if-absent: Secret workspace-api-crypto holds the
# 32-byte AES key (base64) the API uses to encrypt pipeline source
# credentials and dbt git credentials at rest in the box database, and to
# HMAC credential fingerprints. It is the key's only home — there is no
# rotation path and no central copy (that is the point: the box's product
# secrets stay on the box). Losing it means the encrypted columns are
# unreadable; it is covered by the nightly pg_dump only in encrypted form,
# so a restore also needs this Secret — noted in the backup runbook.
#
# Step 2 (Phase 3C), create-if-absent + ensure: Secret console-oidc and the
# box Casdoor application `console` the Console signs in against. Imperative
# rather than declarative (the casdoor seed's initDataApplications) for
# three reasons, the third decisive:
#   1. redirect URIs will change when the Console itself moves onto the box
#      (Phase 3D), and init_data is create-if-absent — already-provisioned
#      boxes would never converge;
#   2. tokenFormat must be JWT-Standard, and the init_data template hardcodes
#      "JWT" — which embeds the whole user object, putting 2-3KB on the
#      Authorization header of every Connect call;
#   3. the casdoor seed union-merges every app's client id into Secret
#      lakekeeper-audiences. A `console` entry there would make a browser
#      session token a valid Lakekeeper catalog audience — privilege
#      expansion, not a side effect. Rill and Gitea are deliberately absent
#      from that list for the same reason.
#
# Wave -1 Sync hook: runs before the wave-0 Deployment that consumes both
# Secrets; RBAC sits at wave -2.
apiVersion: batch/v1
kind: Job
metadata:
  name: workspace-api-seed
  labels:
    app: workspace-api-seed
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: workspace-api-seed
    spec:
      restartPolicy: OnFailure
      serviceAccountName: workspace-api-seed
      containers:
        - name: seed
          image: {{ .Values.seedImage }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              # Finite read (dd, busybox-safe) — an unbounded
              # `tr </dev/urandom | head` dies with SIGPIPE, which pipefail
              # can turn into a Job failure.
              randhex() { dd if=/dev/urandom bs=1024 count=1 2>/dev/null | tr -dc 'a-f0-9' | head -c "$1"; }
              rand() { dd if=/dev/urandom bs=1024 count=1 2>/dev/null | tr -dc 'A-Za-z0-9' | head -c "$1"; }

              # Absent-vs-forbidden matters (rill-seed precedent): a Secret
              # missing from the Role's resourceNames makes the get Forbidden,
              # the "absent" branch creates it, the read-back dies, and every
              # retry then crashes on AlreadyExists. Only NotFound may take
              # the create path.
              secret_absent() {
                out=$(kubectl get secret "$1" 2>&1 >/dev/null) && return 1
                echo "$out" | grep -qi "notfound" && return 0
                echo "secret get $1 failed (not NotFound): $out" >&2
                exit 1
              }

              # --- 1. workspace-api-crypto: create-if-absent --------------
              if ! secret_absent workspace-api-crypto; then
                echo "workspace-api-crypto already exists"
              else
                # Exactly 32 raw bytes (crypto.NewAESEncryptor rejects any
                # other length), base64 without the trailing newline the
                # binary would otherwise fail to decode.
                KEY=$(dd if=/dev/urandom bs=32 count=1 2>/dev/null | base64 | tr -d '\n')
                kubectl create secret generic workspace-api-crypto \
                  --from-literal=key="$KEY"
                echo "workspace-api-crypto created"
              fi

              # --- 1b. workspace-api-oauth-state: create-if-absent --------
              # HMAC key signing the Google OAuth state parameter (0.16.0
              # box-local consent flow). Box-generated like the crypto key,
              # but unlike it, losing this one costs nothing durable: a state
              # signed before a regeneration fails verification and the user
              # just clicks Connect again.
              if ! secret_absent workspace-api-oauth-state; then
                echo "workspace-api-oauth-state already exists"
              else
                kubectl create secret generic workspace-api-oauth-state \
                  --from-literal=state-secret="$(rand 48)"
                echo "workspace-api-oauth-state created"
              fi

              # --- 2. console-oidc + Casdoor application `console` --------
              # The Console is a browser SPA and therefore a PUBLIC client:
              # it redeems the code with PKCE and never sends a secret. One
              # is generated anyway because Casdoor requires the field, and
              # it stays on the box — nothing reads it.
              if ! secret_absent console-oidc; then
                echo "console-oidc already exists"
              else
                kubectl create secret generic console-oidc \
                  --from-literal=client-id="$(randhex 20)" \
                  --from-literal=client-secret="$(rand 40)"
              fi

              # Read back — a pre-existing secret's values are the truth.
              CLIENT_ID=$(kubectl get secret console-oidc -o jsonpath='{.data.client-id}' | base64 -d)
              CLIENT_SECRET=$(kubectl get secret console-oidc -o jsonpath='{.data.client-secret}' | base64 -d)

              CASDOOR="https://auth.customer-{{ .Values.slug }}.{{ .Values.baseDomain }}"
              API_ID=$(jq -r '.applications[] | select(.name == "web") | .clientId' /casdoor-init/init_data.json)
              API_SECRET=$(jq -r '.applications[] | select(.name == "web") | .clientSecret' /casdoor-init/init_data.json)

              i=0
              until curl -sf "$CASDOOR/api/health" >/dev/null || [ "$i" -ge 60 ]; do
                echo "Waiting for Casdoor..."
                i=$((i + 1))
                sleep 5
              done

              # The box-hosted Console's callback is the ONLY redirect URI
              # since the Console split's Phase 5. The hosted Console's old
              # /callback/workspace is actively REMOVED by the converge below:
              # that app no longer has a workspace login, and a registered
              # redirect nobody serves is a stale grant target.
              STALE_HOSTED_REDIRECT="https://console.fairtier.com/callback/workspace"
              BOX_REDIRECT="https://console.customer-{{ .Values.slug }}.{{ .Values.baseDomain }}/callback"

              existing=$(curl -sf -u "$API_ID:$API_SECRET" \
                "$CASDOOR/api/get-application?id=admin/console" | jq -r '.data')
              if [ "$existing" != "null" ]; then
                echo "Casdoor application console already exists"
              else
                # organization is the BARE slug — that is how the casdoor
                # seed creates the org (the "customer-" prefix is the
                # domain's, not the org's).
                body=$(jq -n \
                  --arg org "{{ .Values.slug }}" \
                  --arg name "$CUSTOMER_NAME" \
                  --arg clientId "$CLIENT_ID" \
                  --arg clientSecret "$CLIENT_SECRET" \
                  --arg boxRedirect "$BOX_REDIRECT" \
                  '{
                    owner: "admin",
                    name: "console",
                    displayName: ("FairTier Console - " + $name),
                    description: ("FairTier Console access to the " + $name + " workspace"),
                    organization: $org,
                    cert: ("cert-" + $org),
                    clientId: $clientId,
                    clientSecret: $clientSecret,
                    # No password form: this app is signed in through the
                    # `fairtier-central` federation provider the reconciler
                    # attaches, and Casdoor only auto-redirects to a single
                    # provider when password/code/WebAuthn/LDAP are all off.
                    # Left on, the login page leads with a username field and
                    # the customer types their FairTier username into a form
                    # that only looks up BOX-local accounts. The reconciler
                    # enforces this too, for boxes seeded before it changed.
                    enablePassword: false,
                    enableSignUp: false,
                    grantTypes: ["authorization_code"],
                    redirectUris: [$boxRedirect],
                    tokenFormat: "JWT-Standard",
                    expireInHours: 168,
                    refreshExpireInHours: 336
                  }')
                resp=$(curl -sf -u "$API_ID:$API_SECRET" \
                  -H "Content-Type: application/json" \
                  -d "$body" \
                  "$CASDOOR/api/add-application")
                status=$(echo "$resp" | jq -r '.status')
                if [ "$status" != "ok" ]; then
                  echo "add-application failed: $resp" >&2
                  exit 1
                fi
                echo "Casdoor application console created"
              fi

              # Ensure redirects + tokenFormat on the LIVE application: the
              # create path runs once, so this is what converges a box
              # provisioned before a URI changed. clientSecret is re-stamped
              # because Casdoor masks secrets ("***") on reads and writing
              # the mask back would break the client. Only writes on drift.
              app=$(curl -sf -u "$API_ID:$API_SECRET" \
                "$CASDOOR/api/get-application?id=admin/console" | jq -r '.data')
              desired=$(echo "$app" | jq \
                --arg stale "$STALE_HOSTED_REDIRECT" \
                --arg b "$BOX_REDIRECT" \
                --arg clientSecret "$CLIENT_SECRET" \
                '.redirectUris = (((.redirectUris // []) - [$stale]) + [$b] | unique)
                 | .tokenFormat = "JWT-Standard"
                 | .clientSecret = $clientSecret')
              if [ "$(echo "$app" | jq -cS '{r: (.redirectUris // [] | sort), t: .tokenFormat}')" \
                 = "$(echo "$desired" | jq -cS '{r: (.redirectUris // [] | sort), t: .tokenFormat}')" ]; then
                echo "console application already converged"
              else
                resp=$(curl -sf -u "$API_ID:$API_SECRET" \
                  -H "Content-Type: application/json" \
                  -d "$desired" \
                  "$CASDOOR/api/update-application?id=admin/console")
                status=$(echo "$resp" | jq -r '.status')
                if [ "$status" != "ok" ]; then
                  echo "update-application failed: $resp" >&2
                  exit 1
                fi
                echo "console application converged (redirects + tokenFormat)"
              fi
          env:
            - name: CUSTOMER_NAME
              valueFrom:
                configMapKeyRef:
                  # Written by cloud-init (informational contract).
                  name: fairtier-customer
                  key: customerName
          volumeMounts:
            - name: casdoor-init
              mountPath: /casdoor-init
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: casdoor-init
          secret:
            secretName: casdoor-init-data
