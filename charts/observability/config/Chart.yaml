apiVersion: v2
name: box-alloy-config
description: >-
  Per-box River config for Grafana Alloy (the sibling upstream-chart source in
  charts/root/templates/observability.yaml) — the fleet-ops
  observability floor. Ships pod logs to
  central Loki (tenant = slug) and node / ArgoCD (argocd_app_info) /
  cert-manager / cadvisor metrics to central Prometheus via remote_write
  (external labels customer=<slug>, fleet=box), outbound-only through the
  authenticated ingest.<baseDomain> route. Needs slug/baseDomain templating,
  which the static $values file for the upstream chart cannot do — hence this
  mini chart.
type: application
version: 0.4.0
appVersion: "1.10.0" # grafana/alloy chart pin (charts/root/values.yaml)
