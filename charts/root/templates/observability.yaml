# Observability — Grafana Alloy shipping logs + metrics OUTBOUND-ONLY to the
# central stack (ingest.<baseDomain>):
# pod logs → Loki (tenant = slug), node/ArgoCD/cert-manager/cadvisor metrics →
# Prometheus remote_write (external labels customer=<slug>, fleet=box —
# argocd_app_info is the fleet-rollout health feedback). Auth = basic auth
# from Secret `alloy-ingest-auth` (cloud-init contract; legacy boxes:
# ARCHITECTURE.md "Legacy-box migration") — the gateway matches the
# whole Authorization header as an API key (apiKeyAuth) and stamps the
# authenticated slug over X-Scope-OrgID. Also keeps a local OTLP :4317
# receiver so DuckFlight's exporter endpoint resolves (traces are dropped —
# no central trace path v1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: observability
    fairtier.com/customer: "{{ .Values.slug }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: "{{ .Values.alloyChartVersion }}"
      helm:
        # Release name must stay `alloy` — the Service name is the OTLP
        # target baked into charts/duckflight/values.yaml
        # (alloy.observability.svc.cluster.local:4317).
        releaseName: alloy
        valueFiles:
          - $values/charts/observability/values.yaml
    - repoURL: "{{ .Values.repoURL }}"
      targetRevision: "{{ .Values.targetRevision }}"
      ref: values
    - repoURL: "{{ .Values.repoURL }}"
      targetRevision: "{{ .Values.targetRevision }}"
      path: charts/observability/config
      helm:
        releaseName: alloy-config
        parameters:
          - name: slug
            value: "{{ .Values.slug }}"
          - name: baseDomain
            value: "{{ .Values.baseDomain }}"
          # Where the postgres_exporter sidecar lives — the River config
          # scopes its pod discovery to that namespace.
          - name: stackNamespace
            value: "{{ .Values.stackNamespace }}"
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
