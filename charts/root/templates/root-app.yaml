# SELF-MANAGED root app-of-apps: this chart renders the very Application
# that syncs it (same name/namespace as the cloud-init-written bootstrap
# copy — root-app.yaml is the canonical reference). After the first
# sync ArgoCD owns box-root's spec, so day-2 changes (syncPolicy tweaks, new
# fleet-wide helm parameters with chart defaults) reach an existing box with
# the next revision it is pinned to, instead of being frozen in the immutable
# cloud-init copy.
#
# The per-box values (repoURL/targetRevision/slug/baseDomain/acmeEmail, and
# orphanSweepMaxDeletes) are self-referential: they render from the parameters
# already present in this Application's own spec, so the spec reproduces
# itself — changing them day-2 still requires the ops break-glass path (they
# are bootstrap identity; see ARCHITECTURE.md "Day-2"). That fixed point is
# not an obstacle, it is the mechanism: an edit of a live parameter survives
# every later sync because the render reads it back — which is what makes both
# a deploy (targetRevision) and arming the orphan sweep stick.
#
# Prune=false: if this template is ever removed, ArgoCD must NOT prune
# box-root — with the resources finalizer that would cascade-delete every
# app on the box.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: box-root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/name: box-root
    fairtier.com/customer: "{{ .Values.slug }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "{{ .Values.repoURL }}"
    # `required`, because the alternative to failing here is a box quietly
    # following whatever a defaulted ref happens to point at. A pinned box that
    # cannot render is a visible problem; a box that silently un-pins itself is
    # not. This is the only guard needed — the render fails as a whole, so no
    # child Application is produced either.
    targetRevision: "{{ required "targetRevision is required: a box pins an immutable commit, and there is deliberately no default" .Values.targetRevision }}"
    path: charts/root
    helm:
      parameters:
        # Must mirror spec.source.repoURL / targetRevision — the child
        # Applications reference the same repo for their git sources.
        - name: repoURL
          value: "{{ .Values.repoURL }}"
        - name: targetRevision
          value: "{{ .Values.targetRevision }}"
        # Per-customer values
        - name: slug
          value: "{{ .Values.slug }}"
        - name: baseDomain
          value: "{{ .Values.baseDomain }}"
        - name: acmeEmail
          value: "{{ .Values.acmeEmail }}"
        # Per-box arming for the Iceberg orphan sweep (values.yaml). NOT
        # written by cloud-init: a box provisions without it, this template
        # renders the chart default 0 (= dry-run) into box-root's own spec,
        # and arming that box is an edit of this one parameter.
        - name: orphanSweepMaxDeletes
          value: "{{ .Values.orphanSweepMaxDeletes | default 0 }}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
