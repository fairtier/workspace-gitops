# DuckFlight FlightSQL server — same OCI chart + values shape as the frozen
# shared-cluster path, adapted for on-box: gRPC exposed via Traefik IngressRoute (h2c) + cert-manager
# Certificate instead of the shared Gateway API GRPCRoute.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: duckflight
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: duckflight
    fairtier.com/customer: "{{ .Values.slug }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: ghcr.io/fairtier/charts
      chart: duckflight
      targetRevision: "{{ .Values.duckflightChartVersion }}"
      helm:
        releaseName: duckflight
        valueFiles:
          - $values/charts/duckflight/values.yaml
        parameters:
          - name: tenant
            value: "{{ .Values.slug }}"
          - name: otel.serviceName
            value: "duckflight-{{ .Values.slug }}"
          # iceberg.oauth2URI lives in values.yaml now — it is the
          # in-cluster Casdoor endpoint, no longer hostname-dependent
          # (the public auth.customer-* URL hairpinned pod -> own node).
    - repoURL: "{{ .Values.repoURL }}"
      targetRevision: "{{ .Values.targetRevision }}"
      ref: values
    - repoURL: "{{ .Values.repoURL }}"
      targetRevision: "{{ .Values.targetRevision }}"
      path: charts/duckflight/ingress
      helm:
        releaseName: duckflight-ingress
        parameters:
          - name: slug
            value: "{{ .Values.slug }}"
          - name: baseDomain
            value: "{{ .Values.baseDomain }}"
  destination:
    server: https://kubernetes.default.svc
    namespace: "{{ .Values.stackNamespace }}"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
