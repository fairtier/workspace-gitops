# Box-local seeding — the day-2-safe alternative to cloud-init secrets
# (ARCHITECTURE.md, "Day-2 changes"): Gitea's credentials are GENERATED
# ON THE BOX, and its Casdoor application is created through the Casdoor
# API, so this app converges identically on new AND already-provisioned
# boxes. Nothing here touches the (minimal, immutable) cloud-init contract.
# casdoor-init-data itself is rendered on the box by the casdoor-seed Job
# (charts/casdoor/templates/seed-job.yaml).
#
# Wave -1 Sync hook: runs before the wave-0 resources (StatefulSet,
# gitea-init) that consume gitea-secrets; RBAC sits at wave -2. Both steps
# are idempotent:
#   1. create Secret gitea-secrets if absent (admin password, SECRET_KEY,
#      OIDC client pair);
#   2. create Casdoor application `gitea` if absent, authenticated with the
#      `web` application's client credentials from casdoor-init-data
#      (Casdoor management API accepts clientId:clientSecret Basic auth —
#      hand-validation item; fallback is an org-admin /api/login session).
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-seed
  labels:
    app: gitea-seed
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: gitea-seed
    spec:
      restartPolicy: OnFailure
      serviceAccountName: gitea-seed
      containers:
        - name: seed
          image: {{ .Values.seedImage }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              # Finite read (dd, busybox-safe) — an unbounded
              # `tr </dev/urandom | head` dies with SIGPIPE, which pipefail
              # can turn into a Job failure (casdoor-seed hit this in an
              # offline dry-run). 1024 raw bytes keep ~248 alnum chars.
              rand() { dd if=/dev/urandom bs=1024 count=1 2>/dev/null | tr -dc 'A-Za-z0-9' | head -c "$1"; }
              randhex() { dd if=/dev/urandom bs=1024 count=1 2>/dev/null | tr -dc 'a-f0-9' | head -c "$1"; }

              # --- 1. gitea-secrets: create-if-absent --------------------
              if kubectl get secret gitea-secrets >/dev/null 2>&1; then
                echo "gitea-secrets already exists"
              else
                kubectl create secret generic gitea-secrets \
                  --from-literal=admin-username="fairtier-admin" \
                  --from-literal=admin-password="$(rand 24)" \
                  --from-literal=secret-key="$(rand 64)" \
                  --from-literal=oidc-client-id="$(randhex 20)" \
                  --from-literal=oidc-client-secret="$(rand 40)"
              fi

              # Read back — a pre-existing secret's values are the truth.
              CLIENT_ID=$(kubectl get secret gitea-secrets -o jsonpath='{.data.oidc-client-id}' | base64 -d)
              CLIENT_SECRET=$(kubectl get secret gitea-secrets -o jsonpath='{.data.oidc-client-secret}' | base64 -d)

              # --- 2. Casdoor application: create-if-absent --------------
              CASDOOR="https://auth.customer-{{ .Values.slug }}.{{ .Values.baseDomain }}"
              API_ID=$(jq -r '.applications[] | select(.name == "web") | .clientId' /casdoor-init/init_data.json)
              API_SECRET=$(jq -r '.applications[] | select(.name == "web") | .clientSecret' /casdoor-init/init_data.json)

              i=0
              until curl -sf "$CASDOOR/api/health" >/dev/null || [ "$i" -ge 60 ]; do
                echo "Waiting for Casdoor..."
                i=$((i + 1))
                sleep 5
              done

              existing=$(curl -sf -u "$API_ID:$API_SECRET" \
                "$CASDOOR/api/get-application?id=admin/gitea" | jq -r '.data')
              if [ "$existing" != "null" ]; then
                echo "Casdoor application gitea already exists"
                exit 0
              fi

              # Shape mirrors the casdoor-seed-rendered applications
              # (charts/casdoor/templates/seed-template-configmap.yaml).
              body=$(jq -n \
                --arg org "{{ .Values.slug }}" \
                --arg name "$CUSTOMER_NAME" \
                --arg clientId "$CLIENT_ID" \
                --arg clientSecret "$CLIENT_SECRET" \
                --arg redirect "https://git.customer-{{ .Values.slug }}.{{ .Values.baseDomain }}/user/oauth2/casdoor/callback" \
                '{
                  owner: "admin",
                  name: "gitea",
                  displayName: ("Gitea - " + $name),
                  description: ("Gitea git server for " + $name),
                  organization: $org,
                  cert: ("cert-" + $org),
                  clientId: $clientId,
                  clientSecret: $clientSecret,
                  enablePassword: true,
                  enableSignUp: false,
                  grantTypes: ["authorization_code"],
                  redirectUris: [$redirect],
                  tokenFormat: "JWT",
                  expireInHours: 168,
                  refreshExpireInHours: 336
                }')
              resp=$(curl -sf -u "$API_ID:$API_SECRET" \
                -H "Content-Type: application/json" \
                -d "$body" \
                "$CASDOOR/api/add-application")
              status=$(echo "$resp" | jq -r '.status')
              if [ "$status" != "ok" ]; then
                echo "add-application failed: $resp" >&2
                exit 1
              fi
              echo "Casdoor application gitea created"
          env:
            - name: CUSTOMER_NAME
              valueFrom:
                configMapKeyRef:
                  # Written by cloud-init (informational contract).
                  name: fairtier-customer
                  key: customerName
          volumeMounts:
            - name: casdoor-init
              mountPath: /casdoor-init
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: casdoor-init
          secret:
            secretName: casdoor-init-data
