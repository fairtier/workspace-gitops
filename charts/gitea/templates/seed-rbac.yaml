# RBAC for the seed Job (seed-job.yaml). Wave -2: must exist before the
# wave -1 hook pod starts, or the very first sync deadlocks waiting on a
# ServiceAccount that only a later wave would apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-seed
  labels:
    app: gitea-seed
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-seed
  labels:
    app: gitea-seed
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  # `get` is name-scoped; `create` cannot be (K8s RBAC limitation) but the
  # Job only ever creates gitea-secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["gitea-secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-seed
  labels:
    app: gitea-seed
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-seed
subjects:
  - kind: ServiceAccount
    name: gitea-seed
