apiVersion: v2
name: box-system-upgrade
description: >-
  k3s day-2 upgrades via Rancher's system-upgrade-controller — the last leg
  of the Phase-5 fleet-ops floor (a box's k3s version was create-time-frozen
  otherwise; see ARCHITECTURE.md day-2 table). templates/controller.yaml
  and templates/crd.yaml are the UPSTREAM release manifests vendored
  VERBATIM (there is no official chart) — upgrade = re-download both from
  the GitHub release and bump appVersion here. The single authored piece is
  templates/plan-server.yaml: a Plan pinning the whole fleet to
  `k3sVersion` from charts/root/values.yaml, so a k3s upgrade is a normal ring
  rollout (bump the pin, canary, promote).
type: application
version: 0.2.0
appVersion: "v0.19.2" # rancher/system-upgrade-controller release
