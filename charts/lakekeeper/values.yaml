# Lakekeeper chart values for a dedicated-VM box.
#
# Chart: https://lakekeeper.github.io/lakekeeper-charts/ lakekeeper, pinned in
# charts/root/values.yaml (0.11.0 — an exact version since this commit; it was
# the range `0.11.x`, which ArgoCD re-resolves on every sync, so an upstream
# patch could reach the catalog holding every customer's table metadata with
# no commit here at all. That is the one thing this tree exists to prevent).
# Values shape mirrors the frozen
# shared-cluster Application, adapted for on-box:
#   - externalDatabase -> on-box postgres (fairtier-system)
#   - authz -> on-box OpenFGA
#   - auth.oauth2.providerUri -> injected as an Application helm parameter
#     (hostname-dependent: https://auth.customer-<slug>.<baseDomain>); the
#     catalog's start gate below polls its discovery document
#   - no HTTPRoute; ingress lives in charts/lakekeeper/ingress/
#
# Secrets (fairtier-system, existingSecret pattern — nothing in git):
#   lakekeeper-postgres:  postgres-user, postgres-password (cloud-init)
#   lakekeeper-secrets:   encryption-key (cloud-init)
#   lakekeeper-audiences: LAKEKEEPER__OPENID_AUDIENCE (comma-separated
#                         client IDs of the seeded Casdoor applications —
#                         computed ON THE BOX by the casdoor-seed Job)
#
# R2/S3 storage is NOT configured here: warehouses (incl. R2 credentials)
# are created by the FairTier API's worker over the public Lakekeeper URL,
# exactly as on the shared path.

image:
  tag: v0.12.4 # patch on the 0.12 line; chart 0.11.0's own appVersion is 0.12.2

postgresql:
  enabled: false # Use the on-box postgres StatefulSet

dbMigrations:
  enabled: true # Migration job for the external database

externalDatabase:
  type: postgres
  host_read: postgresql.fairtier-system.svc.cluster.local
  host_write: postgresql.fairtier-system.svc.cluster.local
  port: 5432
  database: lakekeeper
  userSecret: lakekeeper-postgres
  userSecretKey: postgres-user
  passwordSecret: lakekeeper-postgres
  passwordSecretKey: postgres-password

secretBackend:
  type: postgres
  postgres:
    encryptionKeySecret: lakekeeper-secrets
    encryptionKeySecretKey: encryption-key

authz:
  backend: openfga
  openfga:
    endpoint: http://openfga-grpc.fairtier-system.svc.cluster.local:8081
    # Single-tenant box: one fixed store (shared path uses a per-customer
    # store created by Terraform; here Lakekeeper's migrate creates it).
    store: lakekeeper

auth:
  # Kept from the shared path for in-cluster bootstrap tooling; the worker
  # bootstraps this instance over the public URL with OIDC.
  k8s:
    enabled: true
    audience: https://kubernetes.default.svc
  oauth2:
    # Injected via Application helm parameter (hostname-dependent).
    providerUri: ""

catalog:
  # Under `catalog`, NOT top-level: this chart nests the catalog Deployment's
  # settings here (the pod carries app.kubernetes.io/component=catalog), and a
  # top-level `resources:` is silently ignored — no error, no warning, the
  # container just renders with none. It sat top-level from the first commit,
  # so lakekeeper ran BestEffort on every box while this file claimed 256Mi.
  # That is the worst kind of drift: the file documents an intent the cluster
  # never had. Verified against the live pod, not just moved.
  #
  # Sized off measured usage (~28Mi steady) with room for compaction bursts.
  # The request is what matters here: it buys Burstable instead of BestEffort,
  # which is the difference between "killed first" and "killed after the
  # things that actually caused the pressure".
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Restricted-PSA-compliant contexts, same as the shared path.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  extraEnvFrom:
    - secretRef:
        name: lakekeeper-audiences

  # Do not start Lakekeeper until Casdoor is serving a discovery document it
  # can actually parse — on EVERY container start, not just the pod's first.
  #
  # Lakekeeper fetches <providerUri>/.well-known/openid-configuration once, at
  # startup, and treats an unparseable answer as FATAL:
  #
  #   Error: Failed to parse openid configuration.
  #          Expected fields: ["jwks_uri", "issuer"]
  #     1: expected ident at line 1 column 2
  #
  # ("column 2" is HTML — Casdoor mid-restart, or Traefik's error page in front
  # of it.) It exits 1, so the whole warehouse is then down for as long as
  # CrashLoopBackOff lasts, which on 2026-08-27 was 18 restarts over ~45
  # minutes after a memory-pressure livelock restarted Casdoor. Both of that
  # night's iceberg-maintenance attempts died against it, the second one after
  # streaming 1.4 GiB of a rewrite it could then not commit. Upstream has no
  # retry to turn on: the primary provider is hard-wired
  # require_connected_on_startup, and an *optional* one that fails is dropped
  # for the life of the process rather than retried.
  #
  # This used to be a blocking `wait-for-oidc` initContainer, which fixed the
  # pod-start case and missed the livelock case: a probe kill of a running
  # catalog restarts the CONTAINER in place, which re-runs its command but
  # never the initContainers — straight into the fatal fetch. So the wait now
  # lives in the container's own command, the same move as rill's catalog gate
  # (charts/rill/templates/_helpers.tpl). A container that waits is never in
  # backoff, so the catalog comes back when Casdoor does rather than at
  # whatever point in the backoff curve it happens to land.
  #
  # The image is a bare Rust binary on distroless — no shell — so stage-tools
  # copies a static busybox into the `tools` emptyDir and the command runs the
  # gate under it, then `exec`s the real binary with the chart's args. It must
  # be the -musl variant: the default busybox image is linked against a newer
  # glibc than distroless ships ("GLIBC_2.38 not found").
  #
  # The chart gives this ONE command to three containers — the catalog
  # (`serve`), its check-db initContainer (`wait-for-db`) and the migration
  # Job (`migrate`) — so the gate runs only for `serve` and everything else
  # passes straight through. That is also why dbMigrations below stages the
  # same busybox: the Job runs this command too.
  #
  # It parses the document rather than checking the status code, because the
  # recorded failure IS a 200-shaped body Lakekeeper could not read: a JSON
  # object naming issuer and jwks_uri, which is what Lakekeeper asks for. No
  # jq in busybox, so it is a shape match, not a parse — enough to tell
  # Casdoor's document from an HTML error page, which is the failure on
  # record. The URL is Lakekeeper's own LAKEKEEPER__OPENID_PROVIDER_URI (the
  # chart's env, from auth.oauth2.providerUri), so the gate cannot poll a
  # different document than the one Lakekeeper then fetches. busybox wget does
  # not verify TLS; that is fine for a wait, which trusts nothing it reads.
  #
  # After WAIT_TIMEOUT_SECONDS it exits 1 and the kubelet restarts the
  # container, which waits again — the same flat curve with a log line saying
  # how long. Bounded so a *permanent* misconfiguration (a wrong hostname, a
  # dead DNS record) still shows as a restarting pod rather than one that
  # waits forever.
  command:
    - /tools/busybox
    - sh
    - -c
    - |
      if [ "$1" = serve ]; then
        bb=/tools/busybox
        url="${LAKEKEEPER__OPENID_PROVIDER_URI%/}/.well-known/openid-configuration"
        parseable() {
          doc=$("$bb" wget -q -T 10 -O - "$url" 2>/dev/null) || return 1
          case "$doc" in
            "{"*'"issuer"'*'"jwks_uri"'*|"{"*'"jwks_uri"'*'"issuer"'*) return 0 ;;
          esac
          return 1
        }
        deadline=$(($("$bb" date +%s) + WAIT_TIMEOUT_SECONDS))
        until parseable; do
          if [ "$("$bb" date +%s)" -ge "$deadline" ]; then
            echo "timed out waiting for a parseable OIDC discovery document at $url; exiting so the kubelet restarts and waits again" >&2
            exit 1
          fi
          echo "waiting for $url to serve a parseable OIDC discovery document..."
          "$bb" sleep 5
        done
        echo "OIDC discovery document is parseable; starting lakekeeper"
      fi
      exec /home/nonroot/lakekeeper "$@"
    # $0 for the script above; the chart's `args` (serve / wait-for-db /
    # migrate) follow it as $1...
    - lakekeeper-gate
  extraEnv:
    # 9 minutes, then exit and restart. Stays under the liveness delay below,
    # so a timed-out gate exits with its reason in the log before liveness
    # could kill it without one.
    - name: WAIT_TIMEOUT_SECONDS
      value: "540"
  # The chart has no startupProbe, and its liveness (1s delay, 5 × 5s) kills a
  # container that has not opened :8181 within ~26s — which is every gate that
  # waits, turning the wait back into the CrashLoopBackOff it exists to avoid.
  # So liveness holds off for 10 minutes after each container start. The cost
  # is that a catalog which hangs inside its first 10 minutes is killed late;
  # one that crashes still restarts at once, and readiness (unchanged, 1s) is
  # what keeps traffic off a catalog that is not serving yet.
  livenessProbe:
    initialDelaySeconds: 600
  extraInitContainers:
    - name: stage-tools
      image: &busybox busybox:1.38-musl
      command: &stageTools ["/bin/cp", "/bin/busybox", "/tools/busybox"]
      # Pod-level runAsNonRoot needs a numeric uid here: this image's USER is
      # root, and extraInitContainers do not inherit containerSecurityContext
      # above (the chart renders them verbatim).
      securityContext: &stageToolsSecurityContext
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65534
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts: &stageToolsMounts
        - name: tools
          mountPath: /tools
      resources: &stageToolsResources
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
  # Rendered into the catalog pod AND the migration Job (and the mounts into
  # check-db too), which is what lets one `command` serve all three.
  extraVolumes:
    - name: tools
      emptyDir:
        sizeLimit: 8Mi
  extraVolumeMounts:
    - name: tools
      mountPath: /tools
      readOnly: true
  dbMigrations:
    # The migration Job runs catalog.command too, so it needs the same busybox.
    extraInitContainers:
      - name: stage-tools
        image: *busybox
        command: *stageTools
        securityContext: *stageToolsSecurityContext
        volumeMounts: *stageToolsMounts
        resources: *stageToolsResources

service:
  type: ClusterIP
  port: 8080 # mirrors the shared path values (catalog serves on 8181)
