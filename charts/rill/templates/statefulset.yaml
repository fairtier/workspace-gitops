# Single-replica Rill on a local-path PVC. The shared path ran Rill on an
# emptyDir + snapshot-to-S3 sidecar because shared-k3s pods move across
# nodes; the box is single-node, so the PVC (customer dashboards + Rill
# state) is simpler and survives restarts the same way gitea/postgres do.
# On top of the PVC, the same sidecar binary in GIT mode syncs the customer
# content with the on-box Gitea repo (fairtier-admin/rill): save = commit +
# plain push, sync = clean-only fast-forward pull — never force, never
# auto-merge (see values.yaml `git:`).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rill
  labels:
    app: rill
    tier: box
spec:
  serviceName: rill
  replicas: 1
  selector:
    matchLabels:
      app: rill
      tier: box
  template:
    metadata:
      labels:
        app: rill
        tier: box
      annotations:
        # Roll the pod when the project ConfigMap changes — the files are
        # COPIED onto the PVC at boot, so without this, config edits sit
        # in the ConfigMap while the pod keeps the copy it took last boot.
        checksum/rill-project: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 30
      # No container in this pod talks to the K8s API.
      automountServiceAccountToken: false
      # uid 1001 = Rill's user in rilldata/rill. Running every container
      # (incl. the copy init) as 1001 keeps /project owned correctly with
      # no root chown; fsGroup makes the PVC writable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Open (or first time: adopt) /project as a clone of the on-box
        # Gitea repo and fast-forward it if clean. Adoption never discards
        # a local file — pre-existing content becomes uncommitted
        # modifications for the sidecar's next save. MUST run before
        # copy-project so the platform-managed overlay lands on top of the
        # checkout.
        - name: git-restore
          image: {{ .Values.sidecarImage }}
          args: ["restore"]
          env:
            {{- include "rill.gitEnv" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: project
              mountPath: /project
        # Overlay the ConfigMap project files on top of the PVC (git-managed
        # config always wins; customer-authored files elsewhere in /project
        # are left alone). The `..*` wipe removes K8s ConfigMap mount
        # metadata (`..data`, `..2026_*`) that an earlier copy may have
        # captured into /project — Rill scans them and reports a connector
        # "name collision". `cp -RL /config/*` (glob skips hidden) never
        # re-copies the mount internals.
        - name: copy-project
          image: {{ .Values.copyImage }}
          command:
            - sh
            - -c
            - "find /project -maxdepth 1 -name '..*' -exec rm -rf {} + 2>/dev/null; cp -RL /config/* /project/"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: rill-config
              mountPath: /config
              readOnly: true
            - name: project
              mountPath: /project
      containers:
        - name: rill
          image: {{ .Values.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Rill resolves `{{ "{{ .env.X }}" }}` from a project-root `.env`
          # file, not from container env, so materialise the file from the
          # secret-backed envs before `exec rill start`. DuckDB-iceberg
          # handles the Lakekeeper OAuth2 exchange + refresh itself (see
          # configmap.yaml), so no token sidecar is needed.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              umask 077
              {
                printf 'LAKEKEEPER_CLIENT_ID=%s\n'     "$LAKEKEEPER_CLIENT_ID"
                printf 'LAKEKEEPER_CLIENT_SECRET=%s\n' "$LAKEKEEPER_CLIENT_SECRET"
              } > /project/.env
              exec rill start /project --no-open
          ports:
            - containerPort: 9009
              name: http
          env:
            # Rill's Lakekeeper catalog client — generated on the box by the
            # casdoor-seed Job, warehouse access granted by the platform
            # worker (see values.yaml icebergSecretsName for the
            # duckflight → rill-iceberg migration).
            - name: LAKEKEEPER_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.icebergSecretsName }}
                  key: client-id
            - name: LAKEKEEPER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.icebergSecretsName }}
                  key: client-secret
          volumeMounts:
            - name: project
              mountPath: /project
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 9009
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9009
            initialDelaySeconds: 10
            periodSeconds: 5
        # save/sync sidecar: autosave commits+pushes UI edits to the Gitea
        # repo; the sync loop fast-forwards remote edits into /project,
        # which Rill's file watcher hot-reloads. TriggerSnapshot on :8484
        # saves on demand; GET /debug/sync-status reports dirty/diverged.
        # AUTH_TOKEN gates RPC + debug (gRPC health stays open for the
        # probe): this sidecar is published at rill-snapshot.customer-<slug>
        # (ingressroute-snapshot.yaml) so central's snapshot proxy can
        # trigger a save on Console Save; the token is minted by the seed
        # Job and deposited to central.
        - name: snapshot
          image: {{ .Values.sidecarImage }}
          args: ["serve"]
          env:
            {{- include "rill.gitEnv" . | nindent 12 }}
            - name: SYNC_INTERVAL
              value: {{ .Values.git.syncInterval | quote }}
            - name: AUTOSAVE_INTERVAL
              value: {{ .Values.git.autosaveInterval | quote }}
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rill-snapshot-auth
                  key: token
          ports:
            - containerPort: 8484
              name: snapshot
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: project
              mountPath: /project
          resources:
            {{- toYaml .Values.sidecarResources | nindent 12 }}
          livenessProbe:
            grpc:
              port: 8484
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: rill-config
          configMap:
            name: rill-project
  volumeClaimTemplates:
    - metadata:
        name: project
      spec:
        accessModes: ["ReadWriteOnce"]
        # No storageClassName: k3s default (local-path) — the box's own
        # disk, same durability story as the postgres PVC (Phase-5 backups).
        resources:
          requests:
            storage: {{ .Values.storage.projectSize }}
