# RBAC for the seed Job (seed-job.yaml). Wave -2: must exist before the
# wave -1 hook pod starts, or the very first sync deadlocks waiting on a
# ServiceAccount that only a later wave would apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rill-seed
  labels:
    app: rill-seed
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rill-seed
  labels:
    app: rill-seed
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  # `get` is name-scoped; `create` cannot be (K8s RBAC limitation) but the
  # Job only ever creates rill-oidc, rill-git, platform-git and
  # rill-snapshot-auth. gitea-secrets is read for the Gitea admin
  # credentials (repo + token seeding, step 3); dlt-oidc is read to
  # authenticate the deposits against central (steps 4-5 — the box's
  # tenant-bound OIDC client). Every secret the Job creates MUST also be
  # listed here: the seed's absent-check reads it back, and a Forbidden get
  # bricked the sync when rill-snapshot-auth was missing (2026-07-12).
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["rill-oidc", "gitea-secrets", "rill-git", "platform-git", "dlt-oidc", "rill-snapshot-auth"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rill-seed
  labels:
    app: rill-seed
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rill-seed
subjects:
  - kind: ServiceAccount
    name: rill-seed
