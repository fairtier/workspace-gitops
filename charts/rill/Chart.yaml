apiVersion: v2
name: box-rill
description: >-
  Per-box Rill — the default BI tool on the dedicated-VM substrate.
  Rill's embedded
  DuckDB ATTACHes the box Lakekeeper warehouse (Iceberg REST, vended R2
  credentials); the UI is gated by oauth2-proxy against the on-box
  Casdoor. Per-customer state (OIDC client, cookie secret) is GENERATED
  ON THE BOX by the seed Job — nothing here depends on cloud-init, so
  the app converges on already-provisioned boxes too (day-2 rule in
  ARCHITECTURE.md). Two instances of the same project: the editor at
  rill.customer-<slug> and a read-only --preview viewer at
  dashboards.customer-<slug>.
type: application
version: 0.3.2
appVersion: "0.87.2"
