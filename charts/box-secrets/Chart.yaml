apiVersion: v2
name: box-secrets
description: >-
  The box half of the day-2 credential channel. Fetches the secrets central
  minted for this box (BoxCredentialService.FetchBoxSecrets, authenticated with
  a token from the box's own Casdoor) and reconciles them into Kubernetes
  Secrets. Exists because the other route from Terraform to a box — cloud-init
  — is create-only on the provider: user_data is pinned with ignore_changes so
  a template edit cannot destroy a customer's machine, and the price of that guard is that anything delivered through it is
  frozen at first boot. This chart is what makes a centrally-minted box
  credential correctable and rotatable. See ARCHITECTURE.md.
type: application
version: 0.1.0
