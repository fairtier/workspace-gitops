apiVersion: v2
name: box-argocd
description: >
  GitOps ownership of the box's own ArgoCD installation: adopts the HelmChart
  CR that cloud-init wrote at first boot, so day-2 ArgoCD upgrades are a
  normal fleet rollout (bump argocdChartVersion in charts/root/values.yaml) instead
  of a create-time-baked pin. The k3s helm-controller performs the actual
  helm upgrade when the CR changes. The release's VALUES are carried by a
  HelmChartConfig instead of the CR, so they survive the frozen cloud-init
  copy of that manifest being re-applied at every k3s start.
type: application
version: 0.1.1
