apiVersion: v2
name: box-backup
description: >-
  Nightly off-box backup CronJob — the "Backups" fleet-ops floor item.
  Dumps every database in the box Postgres
  (casdoor, openfga, lakekeeper, gitea, …) with pg_dump and tars the Gitea
  data/config PVCs (hosted dbt/Rill repos, dlt state repo, app.ini with
  Gitea's autogenerated secrets), then uploads to the customer's own bucket
  under backups/ with the cloud-init-staged fairtier-storage credentials —
  their storage, so the backup doubles as the portability story. Dump naming
  matches the central platform's backup tool, so its restore command
  works against this layout unchanged. Iceberg data itself is NOT backed up
  here: it already lives in the bucket, with time travel as the oops-window
  (see charts/iceberg-maintenance).
type: application
version: 0.1.0
appVersion: "1.74.4" # rclone
