# slug + baseDomain are injected by the app-of-apps
# (charts/root/templates/backup.yaml); placeholders here.
slug: ""
baseDomain: "fairtier.com"

# Same image the box Postgres already runs (client tools only — pg_dump
# talks to the postgresql Service), so the nightly run pulls nothing new.
pgImage: postgres:17-alpine
# Official rclone image from ghcr (no Docker Hub rate limits). No :latest.
rcloneImage: ghcr.io/rclone/rclone:1.74.4

# Nightly at 03:30 UTC — after iceberg-maintenance (02:30), before EU
# business hours.
schedule: "30 3 * * *"

# Nightly backups older than this are pruned from the bucket (rclone
# delete --min-age on upload mtime — covers dumps and tars uniformly).
# Matches the platform postgres-backup retention and the 7-day Iceberg
# time-travel window.
retentionDays: 7

rclone:
  # S3 provider quirks profile. The box default storage is Cloudflare R2;
  # BYOS boxes override this per their provider (`rclone help backend s3`
  # lists the accepted names).
  provider: Cloudflare

# Applied to both the dump initContainer and the upload container. The
# dump streams through gzip and rclone streams multipart uploads, so
# memory stays flat regardless of database/repo size.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
