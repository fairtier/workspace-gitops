apiVersion: v2
name: box-traefik
description: >-
  Resource requests for the k3s-bundled Traefik, delivered as a
  HelmChartConfig so GitOps can tune a component k3s installs and owns.
  Traefik is not deployed from this repo — k3s writes its HelmChart manifest
  at first boot — so this chart carries no Deployment, only the values
  overlay k3s's helm-controller merges into that release.
  Exists because the box's ingress shipped with no resource requests at all,
  i.e. BestEffort QoS and first in line for the OOM killer; see
  charts/argocd/templates/helmchartconfig.yaml for the full mechanism and the
  net-neutral sizing rule this must respect.
type: application
version: 0.2.0
