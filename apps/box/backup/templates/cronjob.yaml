# Nightly off-box backup — two stages in one pod:
#   1. dump (initContainer): pg_dump of every non-template database on the
#      box Postgres + tar of the Gitea data/config PVCs, into an emptyDir.
#   2. upload: rclone copies the staging dir to the customer's bucket under
#      backups/ and prunes objects older than retentionDays.
# Credentials are the cloud-init-staged fairtier-storage Secret (static,
# bucket-scoped RW — vended Lakekeeper credentials are warehouse-scoped and
# unusable for the backups/ prefix) and the postgres superuser password.
# Both exist on every box since first boot, so this rolls to the live fleet
# as an ordinary change to this tree — no cloud-init change, no new secret.
#
# Consistency: the pg dumps are transaction-consistent per database. The
# Gitea tar is taken on live bare repos — refs update atomically and the
# job runs at night, so the worst case is a backup missing an in-flight
# push, self-repaired the next night. Gitea's DB is dumped in the same run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: box-backup
  labels:
    app: box-backup
    tier: box
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # One retry, then wait for the next night — same policy as
      # iceberg-maintenance: a backup failing twice needs a human look at
      # the job log, and yesterday's backup is still in the bucket.
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: box-backup
            tier: box
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            # uid/gid 1000 = gitea's fsGroup, so the PVC files are readable.
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: dump
              image: {{ .Values.pgImage }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command: ["/bin/sh", "-c"]
              # Filename shape postgres_<db>_<ts>.sql.gz + per-db prefix
              # must match the central platform's backup tool (backup-all),
              # so its restore command and retention regex stay compatible.
              args:
                - |
                  set -eu -o pipefail
                  # PGHOST is a HEADLESS service: a not-ready postgres pod or
                  # a CoreDNS blip makes the name unresolvable outright
                  # ("could not translate host name"), which is how the
                  # 2026-07-19 nightly failed both attempts inside a minute.
                  # Wait like gitea-init does instead of failing cold.
                  i=0
                  until pg_isready -q || [ "$i" -ge 30 ]; do
                    echo "waiting for postgres (dns/readiness)..."
                    i=$((i + 1))
                    sleep 10
                  done
                  ts=$(date -u +%Y%m%d_%H%M%S)
                  databases=$(psql -d postgres -t -A -c \
                    "SELECT datname FROM pg_database WHERE NOT datistemplate AND datname <> 'postgres'")
                  for db in $databases; do
                    echo "dumping $db"
                    mkdir -p "/work/postgres/$db"
                    pg_dump --format=plain "$db" | gzip > "/work/postgres/$db/postgres_${db}_${ts}.sql.gz"
                  done
                  echo "archiving gitea"
                  mkdir -p /work/gitea
                  tar -C /var/lib/gitea -czf "/work/gitea/gitea_data_${ts}.tar.gz" .
                  tar -C /etc/gitea -czf "/work/gitea/gitea_config_${ts}.tar.gz" .
                  du -sh /work/postgres /work/gitea
              env:
                - name: PGHOST
                  value: postgresql
                - name: PGUSER
                  value: postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: postgres-password
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: gitea-data
                  mountPath: /var/lib/gitea
                  readOnly: true
                - name: gitea-config
                  mountPath: /etc/gitea
                  readOnly: true
          containers:
            - name: upload
              image: {{ .Values.rcloneImage }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  rclone copy /work "dest:${S3_BUCKET}/backups" --transfers 4
                  rclone delete "dest:${S3_BUCKET}/backups" --min-age "${RETENTION_DAYS}d"
                  rclone lsl "dest:${S3_BUCKET}/backups"
                  # Freshness heartbeat for the BoxBackupStale alert: only
                  # reached because set -eu aborted on any dump/upload failure
                  # above. The box Alloy's node_exporter textfile collector
                  # scrapes /var/lib/node-exporter/textfile (host path) and
                  # remote-writes box_backup_last_success_timestamp_seconds to
                  # central Prometheus. Atomic write (tmp + mv) so a scrape
                  # never sees a half-written file.
                  ts_epoch=$(date -u +%s)
                  printf 'box_backup_last_success_timestamp_seconds %s\n' "$ts_epoch" > /textfile/box_backup.prom.tmp
                  chmod 0644 /textfile/box_backup.prom.tmp
                  mv /textfile/box_backup.prom.tmp /textfile/box_backup.prom
              env:
                # Remote "dest" defined entirely via env — no config file.
                - name: RCLONE_CONFIG_DEST_TYPE
                  value: s3
                - name: RCLONE_CONFIG_DEST_PROVIDER
                  value: {{ .Values.rclone.provider | quote }}
                # The bucket exists (Terraform-managed / BYOS); the scoped
                # token has no bucket-create permission.
                - name: RCLONE_CONFIG_DEST_NO_CHECK_BUCKET
                  value: "true"
                - name: RCLONE_CONFIG_DEST_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: fairtier-storage
                      key: s3Endpoint
                - name: RCLONE_CONFIG_DEST_REGION
                  valueFrom:
                    secretKeyRef:
                      name: fairtier-storage
                      key: s3Region
                - name: RCLONE_CONFIG_DEST_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: fairtier-storage
                      key: s3AccessKeyId
                - name: RCLONE_CONFIG_DEST_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: fairtier-storage
                      key: s3SecretAccessKey
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: fairtier-storage
                      key: s3Bucket
                - name: RETENTION_DAYS
                  value: {{ .Values.retentionDays | int64 | quote }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                # node_exporter textfile dir on the host — the backup writes
                # its freshness heartbeat here for the box Alloy to scrape.
                - name: textfile
                  mountPath: /textfile
          volumes:
            # Staging area on the box disk — same disk the PVCs live on, so
            # no sizeLimit: a backup that can't fit was going to fail either
            # way, and the emptyDir is reclaimed when the pod completes.
            - name: work
              emptyDir: {}
            # Gitea's StatefulSet PVCs (RWO local-path — same-node mount is
            # fine, and a box is single-node by definition).
            - name: gitea-data
              persistentVolumeClaim:
                claimName: data-gitea-0
            - name: gitea-config
              persistentVolumeClaim:
                claimName: config-gitea-0
            # Shared with the box Alloy's node_exporter textfile collector
            # (it reads the same host dir via its /host/root mount). The dir
            # is created world-writable (1777) by cloud-init on new boxes;
            # existing boxes get a one-time mkdir (see apps/box/README.md,
            # "Legacy-box migration"). uid/gid 1000 (this pod) can then write.
            - name: textfile
              hostPath:
                path: /var/lib/node-exporter/textfile
                type: DirectoryOrCreate
