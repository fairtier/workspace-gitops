# gRPC endpoint used by Lakekeeper's authz backend:
# http://openfga-grpc.fairtier-system.svc.cluster.local:8081
apiVersion: v1
kind: Service
metadata:
  name: openfga-grpc
  labels:
    app: openfga
spec:
  selector:
    app: openfga
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: grpc
  type: ClusterIP
