# Renders Casdoor's init_data.json ON THE BOX (day-2 rule, apps/box/README.md
# "Day-2 changes") — the shape comes from git (casdoor-seed-template), the
# secret material from on-box Secrets. Changing the seeded org/apps/cert is a
# normal fleet rollout; nothing identity-related is baked into cloud-init
# except the ONE centrally-known credential (Secret lakekeeper-oidc — the
# worker authenticates to Lakekeeper with it).
#
# Wave -1 Sync hook (RBAC + template ConfigMap at -2), idempotent:
#   1. resolve each application's OIDC client pair: existing per-app Secret
#      → legacy cloud-init casdoor-init-data (pre-rework boxes) → generate
#      (box-local apps only; missing CENTRAL credentials fail hard);
#   2. resolve the org admin password the same way (box-local only — the
#      platform never holds it);
#   3. fill the template, write Secret casdoor-init-data, and restart the
#      casdoor Deployment if the rendered JSON changed (Casdoor reads the
#      file at startup; initDataNewOnly=true makes re-reads create-if-absent);
#   4. converge Secret lakekeeper-audiences (comma-joined client IDs).
apiVersion: batch/v1
kind: Job
metadata:
  name: casdoor-seed
  labels:
    app: casdoor-seed
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: casdoor-seed
    spec:
      restartPolicy: OnFailure
      serviceAccountName: casdoor-seed
      containers:
        - name: seed
          image: {{ .Values.seedImage }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              # Finite read (dd, busybox-safe) — an unbounded
              # `tr </dev/urandom | head` dies with SIGPIPE, which pipefail
              # turns into a Job failure when the result is captured in an
              # assignment. 1024 raw bytes keep ~248 alnum / ~64 hex chars.
              rand() { dd if=/dev/urandom bs=1024 count=1 2>/dev/null | tr -dc 'A-Za-z0-9' | head -c "$1"; }
              randhex() { dd if=/dev/urandom bs=1024 count=1 2>/dev/null | tr -dc 'a-f0-9' | head -c "$1"; }

              # Only NotFound may take a create path. A Secret missing from
              # the Role's resourceNames makes the get Forbidden, which a
              # naive check reads as "absent": the create then fails, and
              # every retry crashes on AlreadyExists instead of saying what
              # is actually wrong.
              secret_absent() {
                out=$(kubectl get secret "$1" 2>&1 >/dev/null) && return 1
                echo "$out" | grep -qi "notfound" && return 0
                echo "secret get $1 failed (not NotFound): $out" >&2
                exit 1
              }

              # Legacy source: boxes provisioned before the on-box seed got
              # the full init_data.json from cloud-init. Its generated
              # credentials are the truth for those boxes — extract, then
              # materialize them into the per-app Secrets so every box ends
              # up in the same state.
              legacy=/tmp/legacy.json
              if kubectl get secret casdoor-init-data >/dev/null 2>&1; then
                kubectl get secret casdoor-init-data \
                  -o jsonpath='{.data.init_data\.json}' | base64 -d > "$legacy" || true
              fi

              # --- 1. per-application OIDC client pairs ------------------
              rendered=/tmp/init_data.json
              cp /seed/init_data.json.tpl "$rendered"
              audiences=""
              while read -r name secret generated; do
                [ -n "$name" ] || continue
                if kubectl get secret "$secret" >/dev/null 2>&1; then
                  id=$(kubectl get secret "$secret" -o jsonpath='{.data.client-id}' | base64 -d)
                  sec=$(kubectl get secret "$secret" -o jsonpath='{.data.client-secret}' | base64 -d)
                elif [ -s "$legacy" ] && [ -n "$(jq -r --arg n "$name" \
                    '.applications[] | select(.name == $n) | .clientId // empty' "$legacy")" ]; then
                  id=$(jq -r --arg n "$name" '.applications[] | select(.name == $n) | .clientId' "$legacy")
                  sec=$(jq -r --arg n "$name" '.applications[] | select(.name == $n) | .clientSecret' "$legacy")
                  kubectl create secret generic "$secret" \
                    --from-literal=client-id="$id" \
                    --from-literal=client-secret="$sec"
                elif [ "$generated" = "true" ]; then
                  id=$(randhex 20)
                  sec=$(rand 40)
                  kubectl create secret generic "$secret" \
                    --from-literal=client-id="$id" \
                    --from-literal=client-secret="$sec"
                else
                  echo "FATAL: central credential Secret $secret ($name) is missing" >&2
                  echo "(central credentials are provision-time — cloud-init — or pull-agent delivered)" >&2
                  exit 1
                fi
                sed -i "s|%CLIENT_ID_${name}%|${id}|g; s|%CLIENT_SECRET_${name}%|${sec}|g" "$rendered"
                audiences="${audiences:+$audiences,}$id"
              done < /seed/apps.tsv

              # --- 2. org admin password (box-local only) ----------------
              if kubectl get secret casdoor-admin-credentials >/dev/null 2>&1; then
                admin_pw=$(kubectl get secret casdoor-admin-credentials -o jsonpath='{.data.password}' | base64 -d)
              elif [ -s "$legacy" ] && [ -n "$(jq -r '.users[0].password // empty' "$legacy")" ]; then
                admin_pw=$(jq -r '.users[0].password' "$legacy")
                kubectl create secret generic casdoor-admin-credentials \
                  --from-literal=username="admin" \
                  --from-literal=password="$admin_pw"
              else
                admin_pw=$(rand 24)
                kubectl create secret generic casdoor-admin-credentials \
                  --from-literal=username="admin" \
                  --from-literal=password="$admin_pw"
              fi
              sed -i "s|%ADMIN_PASSWORD%|${admin_pw}|g" "$rendered"

              # Inject the display name via jq (may contain arbitrary
              # characters) — this also validates the rendered JSON.
              jq --arg name "$CUSTOMER_NAME" \
                'walk(if type == "string" then gsub("%CUSTOMER_NAME%"; $name) else . end)' \
                "$rendered" > "$rendered.final"

              # --- 3. casdoor-init-data + restart-on-change --------------
              current=$(kubectl get secret casdoor-init-data \
                -o jsonpath='{.data.init_data\.json}' 2>/dev/null || true)
              desired=$(base64 -w0 < "$rendered.final")
              if [ "$current" = "$desired" ]; then
                echo "casdoor-init-data unchanged"
              else
                kubectl create secret generic casdoor-init-data \
                  --from-file=init_data.json="$rendered.final" \
                  --dry-run=client -o yaml | kubectl apply -f -
                if kubectl get deployment casdoor >/dev/null 2>&1; then
                  kubectl rollout restart deployment casdoor
                fi
                echo "casdoor-init-data updated"
              fi

              # --- 4. lakekeeper-audiences --------------------------------
              # Restart Lakekeeper when the audience list actually changes:
              # it reads LAKEKEEPER__OPENID_AUDIENCE at startup, so tokens of
              # a newly added client (e.g. dlt-oidc) are rejected until the
              # pod rolls. Same compare-then-act shape as step 3.
              #
              # UNION-merge, sorted: the audience-sync CronJob
              # (audience-sync-cronjob.yaml) adds Console service-account
              # client IDs to this secret; the seed must keep them, never
              # clobber the secret back to the static list. Removal of
              # deleted service accounts is the CronJob's job.
              current_aud=$(kubectl get secret lakekeeper-audiences \
                -o jsonpath='{.data.LAKEKEEPER__OPENID_AUDIENCE}' 2>/dev/null | base64 -d || true)
              merged=$(printf '%s\n' $(echo "$audiences,$current_aud" | tr ',' ' ') \
                | grep -v '^$' | sort -u | paste -sd, -)
              kubectl create secret generic lakekeeper-audiences \
                --from-literal=LAKEKEEPER__OPENID_AUDIENCE="$merged" \
                --dry-run=client -o yaml | kubectl apply -f -
              if [ "$current_aud" != "$merged" ] && kubectl get deployment lakekeeper >/dev/null 2>&1; then
                kubectl rollout restart deployment lakekeeper
                echo "lakekeeper restarted (audiences changed)"
              fi

              # --- 5. harden the built-in Casdoor admin ------------------
              # built-in/admin is Casdoor's OWN bootstrap account, created
              # by Casdoor at first startup with a well-known stock default
              # password. Our init_data never touches it (initDataNewOnly
              # skips existing objects), so it is the one credential on the
              # box that no seeded value covers, and it carries full admin
              # rights. Rotate it to a strong random password persisted in
              # Secret casdoor-builtin-admin
              # (break-glass access only). Idempotent: once the stored password
              # logs in there is nothing to do. On first boot casdoor is a
              # later sync-wave and this account does not exist yet — the
              # health probe below fails and hardening defers to the first
              # day-2 sync after casdoor is serving.
              CAS=http://casdoor:8000
              cas_login() {
                curl -s -c /tmp/casjar -X POST "$CAS/api/login" \
                  -H 'Content-Type: application/json' \
                  -d "{\"application\":\"app-built-in\",\"organization\":\"built-in\",\"username\":\"admin\",\"password\":\"$1\",\"type\":\"login\",\"autoSignin\":true}" \
                  2>/dev/null | jq -r '.status // "error"' 2>/dev/null || echo error
              }
              cas_up=""
              for _ in $(seq 1 36); do
                if curl -sf -o /dev/null --max-time 5 "$CAS/api/health" 2>/dev/null; then cas_up=1; break; fi
                sleep 5
              done
              if [ -z "$cas_up" ]; then
                echo "casdoor not serving yet — built-in/admin hardening deferred to next sync"
              else
                if kubectl get secret casdoor-builtin-admin >/dev/null 2>&1; then
                  builtin_pw=$(kubectl get secret casdoor-builtin-admin -o jsonpath='{.data.password}' | base64 -d)
                else
                  builtin_pw=$(rand 32)
                  kubectl create secret generic casdoor-builtin-admin \
                    --from-literal=username="admin" \
                    --from-literal=password="$builtin_pw"
                fi
                if [ "$(cas_login "$builtin_pw")" = "ok" ]; then
                  echo "built-in/admin already hardened"
                elif [ "$(cas_login 123)" = "ok" ]; then
                  st=$(curl -s -b /tmp/casjar -X POST "$CAS/api/set-password" \
                    --data-urlencode "userOwner=built-in" \
                    --data-urlencode "userName=admin" \
                    --data-urlencode "oldPassword=123" \
                    --data-urlencode "newPassword=$builtin_pw" \
                    2>/dev/null | jq -r '.status // "error"' 2>/dev/null || echo error)
                  if [ "$st" = "ok" ] && [ "$(cas_login "$builtin_pw")" = "ok" ] && [ "$(cas_login 123)" != "ok" ]; then
                    echo "built-in/admin password rotated (stock default disabled)"
                  else
                    echo "WARNING: built-in/admin rotation did not verify (set-password: $st)" >&2
                  fi
                else
                  echo "WARNING: built-in/admin login failed with both stored and default password — manual check needed" >&2
                fi

                # --- 6. converge org.languages + org admin email -----------
                # Casdoor's login page renders the "Languages" signin item as
                # `organizationObj.languages.length` and CRASHES (null.length)
                # when languages is null — blocking EVERY browser OIDC login
                # (Rill, dashboards, Gitea). oauth2-proxy also needs the login
                # user to carry an `email` claim. init_data seeds both for new
                # boxes; existing objects (initDataNewOnly skips them) converge
                # here via the admin API. `columns=` scopes the write to that
                # one field, so the round-trip can't clobber masked fields
                # (password hash, salts, client secrets).
                admin_email="admin@customer-{{ .Values.slug }}.{{ .Values.baseDomain }}"
                if [ "$(cas_login "$builtin_pw")" = "ok" ]; then
                  org_id="admin/{{ .Values.slug }}"
                  user_id="{{ .Values.slug }}/admin"
                  langs=$(curl -s -b /tmp/casjar "$CAS/api/get-organization?id=$org_id" | jq -r '.data.languages // [] | length' 2>/dev/null || echo 0)
                  if [ "${langs:-0}" -gt 0 ] 2>/dev/null; then
                    echo "org languages already set ($langs)"
                  else
                    ob=$(curl -s -b /tmp/casjar "$CAS/api/get-organization?id=$org_id" | jq -c '.data | .languages=["en"]' 2>/dev/null)
                    if [ -n "$ob" ] && [ "$ob" != "null" ]; then
                      st=$(curl -s -b /tmp/casjar -X POST "$CAS/api/update-organization?id=$org_id&columns=languages" \
                        -H 'Content-Type: application/json' -d "$ob" | jq -r '.status // "error"' 2>/dev/null || echo error)
                      echo "org languages set to [en]: $st"
                    else
                      echo "WARNING: could not read org $org_id to set languages" >&2
                    fi
                  fi
                  # email must ALSO be marked verified: oauth2-proxy rejects an
                  # unverified email claim (500 "isn't verified"). The box
                  # assigns this synthetic admin@... address itself (no SMTP /
                  # verification flow), so the platform vouches for it.
                  cur=$(curl -s -b /tmp/casjar "$CAS/api/get-user?id=$user_id")
                  cur_email=$(echo "$cur" | jq -r '.data.email // ""' 2>/dev/null || echo "")
                  cur_verified=$(echo "$cur" | jq -r '.data.emailVerified // false' 2>/dev/null || echo false)
                  if [ -n "$cur_email" ] && [ "$cur_verified" = "true" ]; then
                    echo "org admin email already set + verified"
                  else
                    ub=$(echo "$cur" | jq -c --arg e "$admin_email" '.data | .email=$e | .emailVerified=true' 2>/dev/null)
                    if [ -n "$ub" ] && [ "$ub" != "null" ]; then
                      st=$(curl -s -b /tmp/casjar -X POST "$CAS/api/update-user?id=$user_id&columns=email,email_verified" \
                        -H 'Content-Type: application/json' -d "$ub" | jq -r '.status // "error"' 2>/dev/null || echo error)
                      echo "org admin email set ($admin_email) + verified: $st"
                    else
                      echo "WARNING: could not read user $user_id to set email" >&2
                    fi
                  fi
                else
                  echo "WARNING: no admin session to converge org languages/email" >&2
                fi
                rm -f /tmp/casjar
              fi

              # --- 7. federation client: mint here, deposit to central ---
              # The OAuth client this box's Casdoor federates through ("sign
              # in with FairTier") is minted HERE and deposited, so the
              # secret that ends up in this box's database is the box's own
              # credential rather than one central minted and pushed down.
              # Central registers what it is given; rotating is re-creating this Secret and letting
              # the next deposit converge both ends.
              #
              # Create-if-absent, like every other pair above: a pre-existing
              # Secret is the truth, so a re-run never rotates by accident.
              if secret_absent fairtier-central-oidc; then
                kubectl create secret generic fairtier-central-oidc \
                  --from-literal=client-id="$(randhex 20)" \
                  --from-literal=client-secret="$(rand 40)"
                echo "fairtier-central-oidc created"
              fi

              FED_ID=$(kubectl get secret fairtier-central-oidc -o jsonpath='{.data.client-id}' | base64 -d)
              FED_SECRET=$(kubectl get secret fairtier-central-oidc -o jsonpath='{.data.client-secret}' | base64 -d)

              if ! kubectl get secret dlt-oidc >/dev/null 2>&1; then
                echo "WARNING: dlt-oidc absent — federation client not deposited; the next sync retries"
              else
                OIDC_ID=$(kubectl get secret dlt-oidc -o jsonpath='{.data.client-id}' | base64 -d)
                OIDC_SECRET=$(kubectl get secret dlt-oidc -o jsonpath='{.data.client-secret}' | base64 -d)
                # In-cluster Service, NOT the box's own public hostname. The
                # token still carries the public issuer — Casdoor stamps `iss`
                # from its configured `origin` (see the configmap), not from
                # the request host — which is what central binds the tenant
                # from. Verified on a box: an in-cluster token comes back with
                # iss=https://auth.customer-<slug>.<domain>, sub=admin/dlt-worker.
                #
                # Going out through the public name means depending on the box
                # reaching itself, and on a box that is broken in a way that
                # picks itself: the name has both an A and an AAAA, curl
                # prefers the AAAA, and the pod network has no route to the
                # box's own IPv6 — `curl -4` returns 200 where `curl -6`
                # cannot connect. Deposits are non-fatal by design, so this
                # fails silently; the in-cluster Service has neither problem.
                FED_CAS="http://casdoor:8000"

                deposit_federation() {
                  BEARER=$(curl -sf -X POST "$FED_CAS/api/login/oauth/access_token" \
                    -d "grant_type=client_credentials&client_id=$OIDC_ID&client_secret=$OIDC_SECRET" \
                    | jq -r '.access_token')
                  if [ -z "$BEARER" ] || [ "$BEARER" = "null" ]; then
                    return 1
                  fi
                  fedBody=$(jq -n --arg i "$FED_ID" --arg s "$FED_SECRET" \
                    '{client_id: $i, client_secret: $s, note: "casdoor-seed box federation client"}')
                  curl -sf -X POST \
                    "https://worker-api.{{ .Values.baseDomain }}/boxcredential.v1.BoxCredentialService/DepositFederationClient" \
                    -H "Authorization: Bearer $BEARER" \
                    -H "Content-Type: application/json" \
                    -d "$fedBody" >/dev/null
                }

                # Deposited on every sync: central's upsert is idempotent and
                # a fresh central deploy may have an empty table. Retried but
                # NON-FATAL — central may deploy the RPC after this box syncs,
                # and until the deposit lands the existing central-minted
                # client keeps the sign-in working.
                i=0
                until deposit_federation || [ "$i" -ge 5 ]; do
                  echo "Federation client deposit failed, retrying..."
                  i=$((i + 1))
                  sleep 10
                done
                if [ "$i" -ge 5 ]; then
                  echo "WARNING: federation client deposit failed; the next sync retries"
                else
                  echo "federation client deposited to central"
                fi
              fi

              echo "seed complete (audiences: $audiences)"
          env:
            - name: CUSTOMER_NAME
              valueFrom:
                configMapKeyRef:
                  # Written by cloud-init (informational contract).
                  name: fairtier-customer
                  key: customerName
          volumeMounts:
            - name: seed-template
              mountPath: /seed
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: seed-template
          configMap:
            name: casdoor-seed-template
