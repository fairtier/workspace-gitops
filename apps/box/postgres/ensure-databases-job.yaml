# Creates the on-box databases (idempotent CREATE-if-absent). This replaces
# the /docker-entrypoint-initdb.d script, which only ran on a fresh PGDATA
# and made every new database a box-re-provisioning event (day-2 rule:
# apps/box/README.md, "Day-2 changes").
#
# The wanted-database LIST lives in databases-configmap.yaml, NOT inline
# here, on purpose: this Job is a Sync hook and ArgoCD does not diff hook
# resources, so an inline edit would never make the app OutOfSync and the
# hook would never re-run on existing boxes. The ConfigMap is a normal,
# diffed resource — editing it triggers a sync, and this hook (recreated
# every sync) reads the new list. See that file's header.
#
# Wave 1 inside this app: ArgoCD applies the wave-0 StatefulSet + databases
# ConfigMap first and waits for them healthy; the pg_isready initContainer
# is the belt. Consumers (casdoor, openfga migrate, lakekeeper, gitea)
# crashloop/retry until their database exists, so first-boot ordering
# self-heals.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-ensure-databases
  labels:
    app: postgres-ensure-databases
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: postgres-ensure-databases
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h postgresql.fairtier-system.svc.cluster.local -U postgres; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
      containers:
        - name: ensure-databases
          image: postgres:17-alpine
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              psql -h postgresql.fairtier-system.svc.cluster.local -U postgres \
                   -v ON_ERROR_STOP=1 -f /config/ensure-databases.sql
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  # Written by cloud-init into fairtier-system.
                  name: postgres-credentials
                  key: postgres-password
          volumeMounts:
            - name: databases
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: databases
          configMap:
            name: postgres-databases
