# slug + baseDomain are injected by the app-of-apps
# (apps/box/apps/templates/iceberg-maintenance.yaml); placeholders here.
slug: ""
baseDomain: "fairtier.com"

# Baked maintenance image — compaction + snapshot expiry, entrypoint
# `python -m iceberg_maintenance`. Built from the public repo
# github.com/fairtier/iceberg-maintenance and published to ghcr.io/fairtier
# (boxes have no pull secret, so it MUST be public). This replaced the old
# per-run `pip install pyiceberg[pyarrow]` — the single biggest CPU/IO spike
# of the nightly job on a small box. pyiceberg is pinned (==0.11.1) inside the image, not here.
#
# 0.2.0 is the fix for the 2026-07-31 OOM: 0.1.0 read the scan through
# PyIceberg's `to_arrow_batch_reader()`, which despite the name submits every
# data file to an executor up front and holds each finished file's batches
# until the (much slower) writer catches up — O(table size), unbounded by
# rewriteChunkBytes below. Do not roll back to 0.1.0.
#
# 0.3.0 skips tables whose manifests PyIceberg mis-decodes (DuckDB's Iceberg
# writer — the dbt models) *before* rewriting them, instead of failing the
# commit after a full rewrite. Same day, found only because 0.2.0 finally got
# that far.
#
# 0.4.0 instruments the nightly run with OpenTelemetry traces + metrics —
# inert unless OTEL_EXPORTER_OTLP_ENDPOINT is set, and the box Alloy still
# drops every signal it is given (apps/box/observability/config).
#
# 0.6.0 asks "can this table be compacted at all" of EVERY table, ahead of the
# size gates below, instead of only of tables those gates had already elected.
# Behind them, smallFileMaxBytes was silently a control on
# iceberg_maintenance_tables_unsupported: the 32 -> 8 MiB change directly below
# took a canary box's count 2 -> 0, and would have resolved
# BoxIcebergTablesUnsupported, with the DuckDB manifest interop bug exactly
# where it was. Do not roll back past it and read the count as a repair.
#
# 0.7.0 retries the commit when the catalog is merely unavailable, instead of
# discarding the whole finished rewrite behind it — the 2026-08-27 loss. It
# still yields immediately to a concurrent writer (a lost race is not a blip).
#
# 0.8.0 adds the orphan-file sweep (orphanSweep below) — the storage half
# snapshot expiry could never do. Until it, expiry freed nothing at all and
# every compaction *added* to the bill: the generation it replaced stayed in R2
# forever, along with ~1.4 GiB of parquet the 2026-08-27 lost commit left
# behind. It ships in dry-run.
#
# 0.9.0 ships the pre-arming proof as code (`python -m
# iceberg_maintenance.verify`, read-only) and three gauges an armed box can
# be alerted on: whether it is armed at all, what the run deleted, and how many
# tables the sweep REFUSED — a refused table reports zero orphans, so without
# that last one the backlog metric falls when the sweep stops working.
image: ghcr.io/fairtier/iceberg-maintenance:0.9.0

# Lakekeeper warehouse to compact — box convention, same as dlt/DuckFlight/
# Rill (apps/box/dlt/values.yaml warehouse).
warehouse: default
catalogURI: http://lakekeeper:8181/catalog

# Nightly, off business hours, and deliberately OFF the 02:30 slot and OFF the
# */5 grid. At 02:30 the two */5 sync CronJobs both align, so a maintenance
# start there made a 3-pod burst that (with the old 3Gi limit + pip-install
# thrash) stalled kine and cascaded the box. 01:17 is off-peak, never
# coincides with a */5 tick, and clears the ~03:30 reboot window with margin.
# dlt pipeline crons are still customer-chosen, so a clash is possible —
# Iceberg optimistic concurrency turns it into a skipped table (commit
# conflict, logged), retried the next night.
schedule: "17 1 * * *"

# How long the wait-for-catalog initContainer will wait for auth and the
# catalog to answer before failing the attempt. Sized against the observed
# failure, not a guess: the 2026-08-09 run lost the night to an auth path that
# was unavailable for well under a minute, and a box recovering from memory
# pressure has CoreDNS and Casdoor back inside a few minutes.
#
# 10 minutes rather than "wait forever": concurrencyPolicy Forbid means a
# pinned pod would silently eat the following nights too, and a box that
# cannot reach its own catalog for 10 minutes at 01:17 is a real fault that
# should fail visibly (the run stamps no heartbeat, so the stale alert fires
# ~26h later). It also stays clear of the 03:30 backup window.
waitTimeoutSeconds: 600

compaction:
  # A data file below this size counts as "small" (dlt's nightly appends are
  # typically KBs–MBs).
  #
  # 8 MiB, NOT 32: this threshold judges *on-disk parquet* bytes while
  # rewriteChunkBytes below bounds *in-memory Arrow* bytes, and at the ~10:1
  # compression of a real table a 128 MiB Arrow chunk lands as a ~13 MiB
  # parquet file. With a 32 MiB threshold every file the compactor produces
  # was born "small", so the gate re-fired the next night, forever: a canary
  # box rewrote a demo table's 107 files / 1.44 GiB into 107 files /
  # 1.44 GiB on 2026-08-26, and the same no-op rewrite on 08-27 took the box
  # into a kine livelock (slow-SQL lines in the window ran 1 -> 137 -> 328 ->
  # 1376 across four nights) that killed Casdoor, crashlooped Lakekeeper, and
  # lost the run at commit — orphaning the whole 1.44 GiB in R2. Set below the
  # achievable output size so the job stops rewriting tables it cannot
  # improve; the ~3.5 MiB files a dlt `replace` leaves behind are still folded
  # up, which is the actual target. The real fix is a rolling parquet writer
  # that closes on an on-disk size.
  smallFileMaxBytes: 8388608 # 8 MiB
  # Compact a table only when it has at least this many small files — below
  # that, the rewrite churn (new snapshot, R2 writes) isn't worth it.
  minInputFiles: 8
  # There is deliberately NO size cap. The rewrite streams the scan through a
  # chunked read->write (maintenance.py), so memory is O(1) in table size (bounded
  # by rewriteChunkBytes) — a cap would only reintroduce the old "skip the big
  # table" bug that left the 41M-row table uncompacted. This is a
  # *write-amplification* gate instead: the rewrite rewrites every file, so only
  # bother when small files are at least this fraction of the table by bytes
  # (else a huge, already-compacted table would be rewritten in full just to
  # fold in a handful of small files). Per-file bin-packing that lifts this
  # trade-off waits on an atomic file-swap primitive.
  rewriteMinSmallFraction: "0.3"
  # Streaming chunk size — the ONLY thing that sets peak rewrite memory, and it
  # is CONSTANT in table size (the whole point: a 40 GiB table peaks the same as
  # a 40 MiB one). Also the approximate output data-file size. Keep it well
  # under resources.limits.memory; this is the working-set of a streamed
  # pipeline, NOT a "shrink to fit the box" batch cap — the job cannot OOM on a
  # large table regardless of this value, it just does more/fewer flushes.
  rewriteChunkBytes: 134217728 # 128 MiB
  # How many times to offer the FINISHED rewrite to a catalog that did not
  # answer, and the first backoff (doubling: 15s, 30s, 60s, 120s — ~3.75 min
  # of patience across 5 attempts).
  #
  # The asymmetry is the whole argument: the rewrite above is minutes of
  # streaming and gigabytes through R2, the commit is one HTTP call. On
  # 2026-08-27 a canary box streamed all 107 chunks of a demo table and then
  # lost the night to a single `Connection refused` while Lakekeeper was
  # crashlooping — 1.4 GiB of orphans that no OSS tool can sweep.
  #
  # Bounded, not generous: concurrencyPolicy is Forbid, so a run that waits
  # forever eats the following nights too, and no budget was ever going to
  # cover that 45-minute crashloop (the blocking wait-for-oidc initContainer
  # on Lakekeeper is the actual fix for it). This
  # buys back a pod restart, which is what the failure usually is. A commit
  # lost to a *concurrent writer* is never retried and never rebased — see
  # commit_swap in the image.
  commitMaxAttempts: 5
  commitRetryBackoffSeconds: "15"

expiry:
  # Snapshots older than this are expired. Metadata-only: it makes the files
  # unreachable, orphanSweep below is what actually frees them. This is the
  # customer-visible time-travel window; it is documented to the customer,
  # so change both together.
  maxSnapshotAgeMs: 604800000 # 7 days
  # Retention floor: the newest N snapshots are kept regardless of age, so a
  # rarely-written table retains some history. Branch heads and tags are
  # never expired.
  minSnapshotsToKeep: 5

orphanSweep:
  # The only part of this job that DELETES files, so it is a three-state knob
  # and not a boolean:
  #
  #   off      don't even list
  #   dry-run  find unreachable files, publish the count/bytes, delete nothing
  #   delete   actually remove them
  #
  # THIS IS THE FLEET DEFAULT, AND IT IS DELIBERATELY NOT `delete`. Arming is
  # per box: the proof that the orphan set and the live set are disjoint is a
  # property of one warehouse, and a box whose tables were written by an engine
  # we have not met is not covered by another box's proof. Until 2026-08-28
  # this value was `delete`, which armed the whole fleet — including boxes
  # provisioned later, with no report read and no proof run — off one box's
  # evidence.
  #
  # Arming a box = raise `orphanSweepMaxDeletes` above 0 for that box, which
  # overrides `mode` and `maxDeletes` here. It is a per-box helm parameter on
  # the box's own box-root Application, not a value in this repo — see
  # apps/box/apps/values.yaml for why (a slug -> cap map in a fleet-wide chart
  # hands every box every other customer's identity). The procedure that has to
  # come first is the arming procedure — read the dry-run report, then run `python -m iceberg_maintenance.verify --read-back` on that
  # box (image >= 0.9.0, read-only) and get every check PASS.
  #
  # The first box armed this way (2026-08-28) had a backlog dominated by one
  # demo table: every generation the demo pipeline's daily `replace` had ever
  # written was still in the bucket, against a live file set three orders of
  # magnitude smaller. A one-shot Job proved against the real objects that the
  # live files, the current metadata.json, the current manifest list and its
  # manifests were all outside the orphan set. Read your own box's numbers off
  # the metrics below — the shape recurs, the magnitudes do not.
  #
  # Both figures reach central Prometheus as iceberg_maintenance_orphan_files /
  # _orphan_bytes, so what a box is still carrying stays visible in either
  # mode — and `iceberg_maintenance_orphan_sweep_armed` is what tells a
  # dry-run box's flat backlog apart from an armed box's stuck one
  # (the central BoxIcebergOrphanBacklogStuck alert).
  #
  # A value that is none of the three fails the run rather than silently
  # picking a default — for this variable that is the difference between
  # deleting and not deleting.
  mode: dry-run
  # Never delete a file younger than this, however unreachable it looks. Two
  # load-bearing reasons: a concurrent dlt load's in-flight upload is not
  # referenced yet by construction, and the sweep reads the reference set
  # before it lists, so anything written between the two steps would otherwise
  # look like garbage. Same 7 days as the time-travel window above, so "how far
  # back can a mistake reach" is one number and not two.
  minAgeSeconds: 604800 # 7 days
  # Blast radius, per table per run: a bug that mistook the live file set for
  # orphans costs at most this many files and gets a night to be noticed in.
  # It truncates (loudly, in the job log) rather than aborting, so a genuine
  # backlog still drains over successive runs.
  #
  # This is the fleet default, used by a box in dry-run (where it is inert).
  # An armed box's cap comes from its own `orphanSweepMaxDeletes` parameter,
  # because the right number depends on that box's backlog and its delete
  # throughput.
  #
  # The first armed box ran 1000 for its first night (2026-08-28), then 5000
  # once that run had been followed by a table that still reads — at HEAD and
  # at the far end of the time-travel window. Both numbers are measured, not
  # chosen:
  #
  #   - 5000 keeps the delete pass inside the night. R2 DELETEs go one at a
  #     time, and the rate is NOT stable: the first armed run managed 3.6/s
  #     (1000 files), the second 1.8/s (5000 files in 46m40s). So a 5000-file
  #     pass is ~23-47 min — from a 01:17 start that ends by ~02:20, still
  #     clear of the 03:30 backup window, but the margin is an hour and not
  #     two. A whole multi-thousand-file backlog in one pass would be a
  #     several-hour job on a box with no headroom, under concurrencyPolicy
  #     Forbid. If the observed rate falls
  #     further, lower the cap rather than letting a pass run into the backup.
  #   - It still bounds the damage a wrong reference set could do to one
  #     table-night, which is the whole point of having a cap at all.
  #
  # A backlog drains over successive nights at this rate; watch
  # iceberg_maintenance_orphan_bytes fall. If it stops falling while the log
  # still says "capped", the cap is the thing to raise — not the sweep to
  # debug. BoxIcebergOrphanBacklogStuck fires on exactly that state.
  maxDeletes: 5000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    # 1Gi is an ISOLATION BACKSTOP, not a correctness lever. The rewrite
    # streams (O(1) in table size — see maintenance.py), so table size can never
    # push memory past this; it's here only so a hypothetical bug is contained
    # to THIS pod instead of becoming node pressure that stalls kine (k3s
    # SQLite) — the original nightly-stall failure mode of the old 3Gi limit.
    # It is emphatically NOT sized to the data: "OOM is a bug, not a small box"
    # — the fix is streaming, not a bigger (or smaller) number here.
    memory: 1Gi
