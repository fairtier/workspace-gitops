# OIDC gate in front of Rill. `rill start` (local mode) has no
# authentication and the UI has full DuckDB access, so it must never be
# reachable unauthenticated. The shared path gated it with an Envoy
# Gateway SecurityPolicy; Traefik OSS has no OIDC filter, so the box runs
# oauth2-proxy as the Ingress backend proxying to rill:9009.
#
# Client pair + cookie secret come from the rill-oidc Secret generated on
# the box by the rill-seed Job (seed-job.yaml), which also creates the
# matching Casdoor `rill` application.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rill-oauth2-proxy
  labels:
    app: rill-oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rill-oauth2-proxy
  template:
    metadata:
      labels:
        app: rill-oauth2-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # uid 2000 = the distroless image's nonroot user.
        runAsUser: 2000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: {{ .Values.oauth2ProxyImage }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - --http-address=0.0.0.0:4180
            - --provider=oidc
            - --provider-display-name=Casdoor
            # On-box Casdoor over the public hostname — discovery + token
            # endpoint hairpin through servicelb/Traefik (same path the
            # gitea-init Job already validated on the live box).
            - --oidc-issuer-url=https://auth.customer-{{ .Values.slug }}.{{ .Values.baseDomain }}
            - --redirect-url=https://rill.customer-{{ .Values.slug }}.{{ .Values.baseDomain }}/oauth2/callback
            - --scope=openid profile email
            # Any user the box Casdoor authenticates is the customer's own
            # org — no email-domain restriction on a single-tenant box.
            - --email-domain=*
            {{- if .Values.deployShim.enabled }}
            # Upstream is the deploy-shim (not rill:9009 directly): it
            # injects the Deploy-button interceptor and serves /__ft/deploy,
            # proxying everything else to rill:9009. See deploy-shim.yaml.
            # Gated: only take this path once the shim image exists, else
            # oauth2-proxy has no upstream and Rill 502s.
            - --upstream=http://rill-deploy-shim:9009
            {{- else }}
            - --upstream=http://rill:9009
            {{- end }}
            - --skip-provider-button=true
            - --cookie-secure=true
            - --cookie-name=_rill_oauth2
            # Behind Traefik TLS termination — trust X-Forwarded-*.
            - --reverse-proxy=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: rill-oidc
                  key: oidc-client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rill-oidc
                  key: oidc-client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: rill-oidc
                  key: cookie-secret
          ports:
            - containerPort: 4180
              name: http
          resources:
            requests:
              cpu: 20m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 4180
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rill-oauth2-proxy
  labels:
    app: rill-oauth2-proxy
spec:
  selector:
    app: rill-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
