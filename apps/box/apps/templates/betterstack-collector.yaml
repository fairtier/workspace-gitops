{{- if .Values.betterstackCollectorEnabled }}
# Better Stack eBPF collector — kernel-level RED metrics and a service map for
# the box, covering the software nobody instrumented (the customer's dbt/dlt
# work, Rill, Lakekeeper, DuckFlight, Postgres).
#
# GATED OFF FLEET-WIDE, and the gate is the interesting part: the agent
# requests ~2 GiB against a box that livelocked at 3.7 GB
# (the 2026-08-13 box-livelock incident). The full sizing argument, the
# measurement that would settle it, and the required flip ORDER are in
# apps/box/betterstack-collector/values.yaml — read it before setting
# betterstackCollectorEnabled.
#
# Wave 3, with the rest of observability: it needs the `betterstack-collector`
# Secret that box-secrets syncs (wave 0), and mounting a Secret that is not
# there yet is a CreateContainerConfigError with no logs to explain it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: betterstack-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: betterstack-collector
    fairtier.com/customer: "{{ .Values.slug }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://betterstackhq.github.io/collector-helm-chart
      chart: collector
      targetRevision: "{{ .Values.betterstackCollectorChartVersion }}"
      helm:
        releaseName: better-stack-collector
        valueFiles:
          - $values/apps/box/betterstack-collector/values.yaml
    - repoURL: "{{ .Values.repoURL }}"
      targetRevision: "{{ .Values.targetRevision }}"
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
{{- end }}
