# cert-manager (chart pin mirrors the central cluster) + the
# letsencrypt-prod ClusterIssuer (in-repo mini chart, HTTP-01 via Traefik).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: cert-manager
    fairtier.com/customer: "{{ .Values.slug }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: "{{ .Values.certManagerChartVersion }}"
      helm:
        releaseName: cert-manager
        valueFiles:
          - $values/apps/box/cert-manager/values.yaml
    - repoURL: "{{ .Values.repoURL }}"
      targetRevision: "{{ .Values.targetRevision }}"
      ref: values
    - repoURL: "{{ .Values.repoURL }}"
      targetRevision: "{{ .Values.targetRevision }}"
      path: apps/box/cert-manager/issuers
      helm:
        releaseName: box-issuers
        parameters:
          - name: email
            value: "{{ .Values.acmeEmail }}"
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # cert-manager CRDs blow the last-applied-configuration annotation limit
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
