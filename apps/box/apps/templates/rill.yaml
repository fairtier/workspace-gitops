# Per-box Rill — the default BI tool on the dedicated-VM substrate
# (the product review's "no BI on the box" hole). Wave 2: needs
# Casdoor (1) for the seed Job + oauth2-proxy, and Lakekeeper (2) only at
# query time (DuckDB ATTACHes per connection, so ordering vs. lakekeeper
# is not load-bearing).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rill
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: rill
    fairtier.com/customer: "{{ .Values.slug }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "{{ .Values.repoURL }}"
    targetRevision: "{{ .Values.targetRevision }}"
    path: apps/box/rill
    helm:
      releaseName: rill
      parameters:
        - name: slug
          value: "{{ .Values.slug }}"
        - name: baseDomain
          value: "{{ .Values.baseDomain }}"
  destination:
    server: https://kubernetes.default.svc
    namespace: "{{ .Values.stackNamespace }}"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
