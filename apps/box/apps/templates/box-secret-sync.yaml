# NOTE ON THE FILENAME: not `box-secrets.yaml`. apps/.gitignore blocks
# `*-secrets.yaml` (and `*-secret.yaml`, `secret-*.yaml`) to stop a Kubernetes
# Secret manifest being committed by accident, and that pattern would silently
# swallow this Application — the chart would exist in git and never deploy,
# with nothing to see in `git status`. Do not "tidy" the name back.
#
# The box half of the day-2 credential channel (apps/box/box-secrets). Fetches
# the secrets central minted for this box and reconciles them into Kubernetes
# Secrets, on a schedule and on every sync.
#
# Wave 2, and that number is a floor rather than a preference. This chart
# authenticates to central with a Casdoor client-credentials token, and the
# client it uses (`dlt-oidc`) is seeded by the casdoor chart at wave 1 — at
# wave 0 the Secret does not exist yet, the script warns and exits 0, and a
# fresh box would get nothing until the CronJob's first tick 15 minutes later.
#
# So: **wave 2 is the earliest a box secret can exist**, and any consumer of one
# must sync at wave 3 or later. Alloy (apps/box/observability) does, at 3.
#
# The Sync hook at -1 within this release is what makes the ordering tight
# rather than merely eventual: by the time this Application reports healthy the
# Secrets are written, so wave 3 starts against them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: box-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: box-secrets
    fairtier.com/customer: "{{ .Values.slug }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "{{ .Values.repoURL }}"
    targetRevision: "{{ .Values.targetRevision }}"
    path: apps/box/box-secrets
    helm:
      releaseName: box-secrets
      parameters:
        - name: slug
          value: "{{ .Values.slug }}"
        - name: baseDomain
          value: "{{ .Values.baseDomain }}"
  destination:
    server: https://kubernetes.default.svc
    namespace: "{{ .Values.stackNamespace }}"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
