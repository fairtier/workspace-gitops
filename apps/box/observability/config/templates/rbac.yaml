# Supplementary RBAC for the cadvisor scrape: kubelet's webhook authorizer
# maps /metrics/cadvisor to resource nodes/metrics (verb get), which the
# upstream alloy chart's discovery-focused ClusterRole does not grant.
# Bound to the chart's default ServiceAccount (release name `alloy`).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-kubelet-metrics
  labels:
    app.kubernetes.io/name: alloy-config
    app.kubernetes.io/part-of: observability
rules:
  - apiGroups: [""]
    resources: ["nodes/metrics", "nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-kubelet-metrics
  labels:
    app.kubernetes.io/name: alloy-config
    app.kubernetes.io/part-of: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-kubelet-metrics
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: observability
