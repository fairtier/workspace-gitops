# River config consumed by the upstream alloy chart via
# alloy.configMap.{create=false, name=alloy-config, key=config.alloy}
# (apps/box/observability/values.yaml). Everything below pushes OUTBOUND to
# the central ingest route — nothing listens for inbound traffic except the
# in-cluster OTLP receiver at the bottom.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  labels:
    app.kubernetes.io/name: alloy-config
    app.kubernetes.io/part-of: observability
data:
  config.alloy: |
    // ==================================================================
    // Logs: every pod on the box -> central Loki, tenant = customer slug
    // (mirrors the central pipeline, minus the multi-tenant relabel — the whole box IS one tenant).
    // ==================================================================
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        target_label  = "job"
      }

      // Build the log file path from pod UID and container name.
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        target_label  = "__path__"
        replacement   = "/var/log/pods/*$1/*.log"
      }
    }

    // loki.source.file does not glob-expand; local.file_match resolves the
    // wildcard pod-UID directories (same lesson as the central cluster).
    local.file_match "pod_logs" {
      path_targets = discovery.relabel.pod_logs.output
    }

    loki.source.file "pod_logs" {
      targets    = local.file_match.pod_logs.targets
      forward_to = [loki.process.pod_logs.receiver]
    }

    // What of the above actually leaves the box. Until 2026-08-10 the answer
    // was "all of it", while metrics got a hand-curated keep-list a few
    // hundred lines down — an asymmetry nothing justified, and the reason
    // this block exists.
    //
    // The shape of the fix comes from auditing what a box actually emits.
    // Almost none of it is the incident you would go to Loki for: every
    // large stream is a probe or a reconcile loop repeating at ~1 Hz, and
    // several of those lines carry customer material as a side effect —
    // Lakekeeper's audit log names their namespaces and tables, Gitea's
    // access log names their repos, oauth2-proxy's names their users. So
    // one drop-list serves both ends: it cuts the volume that made the
    // 7-day retention mostly probe traffic, and it cuts the content channel.
    //
    // Every rule below is scoped to the container that emits it and keeps
    // the failing case — a non-200 probe, a non-OK gRPC code, a denied
    // authorization, a WARN. Dropping a *successful* health check loses
    // nothing: box liveness is a metrics question (`up`, `pg_up`,
    // `argocd_app_info`), and metrics is where it is answered.
    //
    // Each drop names a reason, which becomes
    // loki_process_dropped_lines_total{reason=...} — scraped below, so the
    // cut is measurable rather than silent. Add a rule and its counter
    // appears; if a rule ever stops matching, its counter goes flat.
    loki.process "pod_logs" {
      stage.cri {}

      stage.match {
        selector = "{container=\"casdoor\"}"

        // Casadoor logs its authz decision for every request, twice, and
        // the readiness probe is most of them. Denials are kept.
        stage.drop {
          expression          = "urlPath = /api/health, .*result = allow$"
          drop_counter_reason = "probe"
        }
      }

      stage.match {
        selector = "{container=\"gitea\"}"

        stage.drop {
          expression          = "router: completed GET /api/healthz for [^,]+, 200 OK in|\\[I\\] PING DATABASE "
          drop_counter_reason = "probe"
        }

        // The box's own sync loops fetch the rill/pipelines/transformations
        // repos every few minutes; the URL names the customer's repos.
        stage.drop {
          expression          = "router: completed GET /[^ ]+\\.git/(info/refs|git-upload-pack)[^ ]* for [^,]+, 200 OK in"
          drop_counter_reason = "git_poll"
        }
      }

      stage.match {
        selector = "{container=\"oauth2-proxy\"}"

        // Access log; the kube-probe lines are noise, the human ones name
        // the customer's users and are kept.
        stage.drop {
          expression          = "\"kube-probe/[^\"]*\" 200 "
          drop_counter_reason = "probe"
        }
      }

      stage.match {
        selector = "{container=\"openfga\"}"

        // One INFO access-log record per authorization check, carrying the
        // full raw_request (store id, tuple keys). grpc_code 0 is OK; any
        // other code survives.
        stage.drop {
          expression          = "grpc_req_complete.*\"grpc_code\": 0\\}"
          drop_counter_reason = "authz_access_log"
        }
      }

      stage.match {
        selector = "{container=\"lakekeeper\"}"

        // The audit log names the customer's Iceberg namespaces and tables
        // on every catalog call. "Authorization failed" is a different
        // message and is kept.
        stage.drop {
          expression          = "\"message\":\"Authorization succeeded event\""
          drop_counter_reason = "catalog_audit"
        }
      }

      stage.match {
        selector = "{container=\"postgresql\"}"

        stage.drop {
          expression          = "LOG:  checkpoint (starting|complete)"
          drop_counter_reason = "checkpoint"
        }
      }

      stage.match {
        selector = "{container=\"application-controller\"}"

        // ArgoCD re-reconciles every app every two minutes and narrates it.
        // The 19M this container had accumulated on a canary box was the single
        // largest log stream on the box. Sync failures are level=error and
        // are kept, as is argocd_app_info, which is what the fleet-rollout
        // check actually reads.
        stage.drop {
          expression          = "level=info msg=\"(Reconciliation completed|GetRepoObjs stats|Skipping auto-sync|Update successful|Comparing app state|Refreshing app status|Ignore status for all objects)"
          drop_counter_reason = "argocd_reconcile_loop"
        }
      }

      stage.match {
        selector = "{container=\"repo-server\"}"

        stage.drop {
          expression          = "level=info msg=\"started call\"|level=info msg=\"finished call\" grpc\\.code=OK|level=info msg=\"manifest cache hit"
          drop_counter_reason = "argocd_reconcile_loop"
        }
      }

      stage.match {
        selector = "{container=\"alloy\"}"

        // CronJob pods come and go every five minutes and the tailer says so
        // twice each time.
        stage.drop {
          expression          = "level=info msg=\"(start|stopped) tailing file\""
          drop_counter_reason = "tailer_churn"
        }
      }

      // Scrub what survives. The 2026-08-10 audit found no credential in any
      // box log — which is the moment to add this, not after the first one
      // ships. Deliberately narrow: five shapes that are a secret in every
      // context they appear in, so nothing operational is lost. A URL with
      // userinfo is the one that matters most on a box, because that is how
      // a Gitea remote and a Postgres DSN carry their password, and both are
      // one traceback away from stdout.
      //
      // Only the capture group is replaced, so the surrounding line — host,
      // user, table name — stays readable.
      stage.replace {
        expression = "://[^/@\\s\"]+:([^/@\\s\"]+)@"
        replace    = "REDACTED"
      }

      stage.replace {
        expression = "(?i)\\bbearer\\s+([A-Za-z0-9._~+/=-]{16,})"
        replace    = "REDACTED"
      }

      stage.replace {
        expression = "\\b(eyJ[A-Za-z0-9._-]{20,})"
        replace    = "REDACTED"
      }

      stage.replace {
        expression = "(AGE-SECRET-KEY-1[0-9A-Z]{20,})"
        replace    = "REDACTED"
      }

      stage.replace {
        expression = "(?i)\\b(?:password|passwd|client_secret)\\b[\"']?\\s*[:=]\\s*[\"']?([^\\s\"',}]{6,})"
        replace    = "REDACTED"
      }

      forward_to = [loki.write.central.receiver{{ if .Values.betterstack.enabled }}, otelcol.receiver.loki.betterstack.receiver{{ end }}]
    }

    loki.write "central" {
      endpoint {
        url       = "https://ingest.{{ .Values.baseDomain }}/loki/api/v1/push"
        // Existing convention: Loki tenant = customer slug (the central
        // cluster's Alloy maps customer-* namespaces the same way).
        tenant_id = "{{ .Values.slug }}"

        basic_auth {
          username      = "{{ .Values.slug }}"
          password_file = "/etc/alloy-ingest/password"
        }
      }
    }

    // ==================================================================
    // Metrics -> central Prometheus remote_write.
    // Every scrape below emits an `up` series; with the external labels
    // this feeds the central BoxGoneSilent alert.
    // ==================================================================

    // Node metrics (embedded node_exporter; host mounts from the chart values).
    // The textfile collector reads the nightly-job heartbeats
    // (box_backup_last_success_timestamp_seconds from apps/box/backup,
    // iceberg_maintenance_last_success_timestamp_seconds from
    // apps/box/iceberg-maintenance) via the existing /host/root mount — no
    // extra volume. The dir is world-writable so those non-root pods can
    // write it (cloud-init on new boxes). Every nightly that can fail
    // silently belongs here; a failed run stamps nothing and goes stale.
    //
    // A heartbeat only catches a nightly that stopped. It says nothing about
    // a nightly that runs, exits 0, and quietly does less than it claims —
    // which is what iceberg_maintenance_tables_unsupported is for, and why
    // the same file carries counts as well as a timestamp.
    //
    // iceberg_maintenance_orphan_files/_orphan_bytes are the same idea applied
    // to storage: a warehouse can be maintained perfectly and still be paying
    // for gigabytes of parquet nothing references (every generation compaction
    // replaced, plus whatever a lost commit stranded). The sweep ships in
    // dry-run, so on most boxes these two ARE its entire output.
    //
    // _orphan_sweep_armed/_orphan_files_deleted/_orphan_sweep_refused are what
    // make that backlog alertable. A large flat backlog is either a stuck
    // sweep or a box nobody has armed yet (arming is per box, and correctly
    // rare), and only `armed` separates them; `deleted` separates "capped but
    // draining" from "deleting nothing"; and `refused` is the honesty check on
    // both, because a table the sweep refuses reports ZERO orphans — the
    // backlog figure falls when the sweep stops working. See
    // BoxIcebergOrphanBacklogStuck / BoxIcebergOrphanSweepRefused.
    prometheus.exporter.unix "node" {
      procfs_path = "/host/proc"
      sysfs_path  = "/host/sys"
      rootfs_path = "/host/root"

      textfile {
        directory = "/host/root/var/lib/node-exporter/textfile"
      }
    }

    prometheus.scrape "node" {
      job_name   = "node"
      targets    = prometheus.exporter.unix.node.targets
      forward_to = [prometheus.remote_write.central.receiver]
    }

    // ArgoCD application-controller (:8082) — argocd_app_info carries
    // sync_status/health_status per app: the fleet-rollout health feedback
    // (metrics enabled in apps/box/argocd valuesContent). Pod-IP discovery;
    // there is no prometheus-operator (ServiceMonitors) on the box.
    discovery.kubernetes "argocd_pods" {
      role = "pod"
      namespaces {
        names = ["argocd"]
      }
    }

    discovery.relabel "argocd_controller" {
      targets = discovery.kubernetes.argocd_pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        regex         = "argocd-application-controller"
        action        = "keep"
      }

      // One target per pod, not per declared container port.
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        regex         = "application-controller"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_ip"]
        target_label  = "__address__"
        replacement   = "$1:8082"
      }
    }

    prometheus.scrape "argocd" {
      job_name   = "argocd"
      targets    = discovery.relabel.argocd_controller.output
      forward_to = [prometheus.remote_write.central.receiver]
    }

    // cert-manager controller (:9402) — certificate expiry/readiness for the
    // BoxCertExpiringSoon alert.
    discovery.kubernetes "certmanager_pods" {
      role = "pod"
      namespaces {
        names = ["cert-manager"]
      }
    }

    discovery.relabel "certmanager" {
      targets = discovery.kubernetes.certmanager_pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        regex         = "cert-manager"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        regex         = "cert-manager-controller"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_ip"]
        target_label  = "__address__"
        replacement   = "$1:9402"
      }
    }

    prometheus.scrape "certmanager" {
      job_name   = "cert-manager"
      targets    = discovery.relabel.certmanager.output
      forward_to = [prometheus.remote_write.central.receiver]
    }

    // postgres_exporter sidecar in the postgres pod (:9187, apps/box/postgres)
    // — the box's single database backs Casdoor, OpenFGA, Lakekeeper, Gitea
    // and pipeline state, so `pg_up` is the closest thing to a box-is-usable
    // signal. Namespace/pod are relabelled explicitly so these series carry
    // the same labels the shared cluster's ServiceMonitor produces and one
    // Grafana dashboard can render both.
    discovery.kubernetes "postgres_pods" {
      role = "pod"
      namespaces {
        names = ["{{ .Values.stackNamespace }}"]
      }
    }

    discovery.relabel "postgres" {
      targets = discovery.kubernetes.postgres_pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        regex         = "postgresql"
        action        = "keep"
      }

      // One target per pod, not one per container in it.
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        regex         = "postgres-exporter"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_ip"]
        target_label  = "__address__"
        replacement   = "$1:9187"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
    }

    prometheus.scrape "postgres" {
      job_name   = "postgres"
      targets    = discovery.relabel.postgres.output
      forward_to = [prometheus.remote_write.central.receiver]
    }

    // kubelet cadvisor — per-container cpu/memory (RBAC: supplementary
    // ClusterRole in rbac.yaml grants nodes/metrics to the alloy SA).
    discovery.kubernetes "nodes" {
      role = "node"
    }

    prometheus.scrape "cadvisor" {
      job_name          = "cadvisor"
      targets           = discovery.kubernetes.nodes.targets
      scheme            = "https"
      metrics_path      = "/metrics/cadvisor"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

      tls_config {
        // kubelet serving cert is self-signed on k3s.
        insecure_skip_verify = true
      }

      forward_to = [prometheus.remote_write.central.receiver]
    }

    // Alloy's own HTTP server (12345, set by the chart). One target, and the
    // keep-list below admits exactly one family from it:
    // loki_process_dropped_lines_total, so the log drop-list at the top of
    // this file is measurable instead of silent — a rule that stops matching
    // shows up as a flat counter rather than as logs nobody notices are gone.
    prometheus.scrape "alloy" {
      job_name   = "alloy"
      targets    = [{"__address__" = "127.0.0.1:12345"}]
      forward_to = [prometheus.remote_write.central.receiver]
    }

    prometheus.remote_write "central" {
      endpoint {
        url = "https://ingest.{{ .Values.baseDomain }}/api/v1/write"

        basic_auth {
          username      = "{{ .Values.slug }}"
          password_file = "/etc/alloy-ingest/password"
        }

        // Keep-list: bounds central Prometheus cardinality to O(100) series
        // per box. Extend deliberately — everything else is dropped HERE,
        // not centrally. Must stay a superset of what the central
        // fleet-box alert rules query.
        //
        // The pg_* entries are per-datname (9 databases on a box), so each
        // one costs ~9 series — which is why the list is a hand-picked
        // handful and not `pg_stat_database_.*`. Two exporter metrics are
        // POINTEDLY absent: pg_settings_* is 270 static config series, and
        // pg_stat_activity_* carries application_name/usename/wait_event
        // labels that are unbounded by construction. pg_settings_max_connections
        // is named individually because the connection alert needs the
        // denominator.
        //
        // node_vmstat_oom_kill is one series and the cheapest thing on this
        // list. Until 2026-08-12 nothing in the fleet could tell us the
        // kernel had killed something: the 2026-08-11 global OOM on a box was
        // found by hand, days later, in dmesg — and dmesg had by then
        // retained 1 of the 5 kills /proc/vmstat had counted. A counter that
        // survives log rotation is the whole point.
        //
        // node_pressure_* (PSI) added 2026-08-13 for BoxNodeStalled. The
        // failure that day produced no OOM kill and no eviction — the box
        // spent 110 minutes unable to complete an SSH handshake while `up`
        // stayed 1 and metrics kept flowing, so neither node_vmstat_oom_kill
        // nor BoxGoneSilent could see it. PSI "full"/stalled is the only
        // series that says "every task is blocked", which is the difference
        // between a busy box and a dead one. Six series per box; the two
        // memory ones carry the alert, cpu/io are kept because triage always
        // wants to know which resource led.
        write_relabel_config {
          source_labels = ["__name__"]
          regex         = "up|loki_process_dropped_lines_total|node_cpu_seconds_total|node_memory_MemTotal_bytes|node_memory_MemAvailable_bytes|node_vmstat_oom_kill|node_pressure_memory_stalled_seconds_total|node_pressure_memory_waiting_seconds_total|node_pressure_cpu_waiting_seconds_total|node_pressure_io_stalled_seconds_total|node_pressure_io_waiting_seconds_total|node_filesystem_avail_bytes|node_filesystem_size_bytes|node_load1|node_load5|node_load15|argocd_app_info|certmanager_certificate_expiration_timestamp_seconds|certmanager_certificate_ready_status|container_cpu_usage_seconds_total|container_memory_working_set_bytes|box_backup_last_success_timestamp_seconds|iceberg_maintenance_last_success_timestamp_seconds|iceberg_maintenance_tables_unsupported|iceberg_maintenance_orphan_files|iceberg_maintenance_orphan_bytes|iceberg_maintenance_orphan_files_deleted|iceberg_maintenance_orphan_sweep_armed|iceberg_maintenance_orphan_sweep_refused|pg_up|pg_settings_max_connections|pg_stat_database_numbackends|pg_stat_database_deadlocks|pg_stat_database_xact_commit|pg_stat_database_xact_rollback|pg_stat_database_blks_hit|pg_stat_database_blks_read|pg_database_size_bytes"
          action        = "keep"
        }

        // template0/template1 exist on every postgres and never change —
        // dropping them removes ~2 series per pg_* metric above for nothing
        // lost. `datname` only appears on postgres_exporter series, so no
        // other metric can be caught by this.
        write_relabel_config {
          source_labels = ["datname"]
          regex         = "template[01]"
          action        = "drop"
        }
      }
{{- if .Values.betterstack.enabled }}

      // Second endpoint: the same curated slice, direct to Better Stack.
      //
      // DIRECT is the point. Everything else this box emits goes through
      // ingest.{{ .Values.baseDomain }}, so the moment central is down we lose
      // sight of the box — exactly when we need it. This path shares nothing
      // with the one above but the scrape.
      //
      // The keep-list is duplicated rather than shared because Alloy scopes
      // write_relabel_config to an endpoint. Both copies must stay identical:
      // a metric kept here but not centrally would alert in one place and not
      // the other, which is worse than not having it.
      endpoint {
        url = "https://" + local.file.betterstack_host.content + "/metrics"

        bearer_token_file = "/etc/betterstack/token"

        write_relabel_config {
          source_labels = ["__name__"]
          regex         = "up|loki_process_dropped_lines_total|node_cpu_seconds_total|node_memory_MemTotal_bytes|node_memory_MemAvailable_bytes|node_vmstat_oom_kill|node_pressure_memory_stalled_seconds_total|node_pressure_memory_waiting_seconds_total|node_pressure_cpu_waiting_seconds_total|node_pressure_io_stalled_seconds_total|node_pressure_io_waiting_seconds_total|node_filesystem_avail_bytes|node_filesystem_size_bytes|node_load1|node_load5|node_load15|argocd_app_info|certmanager_certificate_expiration_timestamp_seconds|certmanager_certificate_ready_status|container_cpu_usage_seconds_total|container_memory_working_set_bytes|box_backup_last_success_timestamp_seconds|iceberg_maintenance_last_success_timestamp_seconds|iceberg_maintenance_tables_unsupported|iceberg_maintenance_orphan_files|iceberg_maintenance_orphan_bytes|iceberg_maintenance_orphan_files_deleted|iceberg_maintenance_orphan_sweep_armed|iceberg_maintenance_orphan_sweep_refused|pg_up|pg_settings_max_connections|pg_stat_database_numbackends|pg_stat_database_deadlocks|pg_stat_database_xact_commit|pg_stat_database_xact_rollback|pg_stat_database_blks_hit|pg_stat_database_blks_read|pg_database_size_bytes"
          action        = "keep"
        }

        write_relabel_config {
          source_labels = ["datname"]
          regex         = "template[01]"
          action        = "drop"
        }
      }
{{- end }}

      external_labels = {
        customer = "{{ .Values.slug }}",
        fleet    = "box",
      }
    }

    // ==================================================================
    // OTLP receiver — local only. DuckFlight points its OTel SDK at
    // alloy.observability.svc:4317 (apps/box/duckflight/values.yaml); the
    // endpoint must resolve so its exporters stop erroring, but everything
    // it sends is DROPPED: the receiving Tempo is single-tenant and the
    // ingest route has no trace path at all (a v1 decision, not an
    // oversight), and
    // an app's OTLP logs would only duplicate its stdout, which the logs
    // pipeline above already ships.
    //
    // The drop is an explicit filter feeding a never-dialed exporter, NOT
    // `output {}`: Alloy only registers a signal's gRPC service once an
    // unbroken consumer chain reaches an exporter. An empty receiver
    // output left :4317 closed (connection refused on the canary box,
    // 2026-07-17), and a processor with an empty output listened but
    // answered "telemetry type is not supported".
    //
    // ALL THREE SIGNALS ARE WIRED, and that is the point: the 2026-07-17
    // fix taught the chain rule for traces and then left logs and metrics
    // unregistered, so a stock OTel SDK — which exports all three to
    // OTEL_EXPORTER_OTLP_ENDPOINT by default — got `Unimplemented` for
    // logs on every batch. DuckFlight logged each failure to stdout, at
    // 1 Hz, forever: 16959 of the last 16962 lines it produced (99.98%)
    // were that one error, and every one of them was shipped to central
    // Loki. Wiring a signal to a drop chain is what keeps that from
    // recurring for the next app that points here; do not narrow this
    // output block to the signals someone happens to send today.
    //
    // The filter's `"true"` conditions match every span/record/metric, so
    // the exporter below never dials its dead endpoint. Verified against
    // alloy v1.17.0 (the box's version) with real telemetrygen pushes of
    // all three signals: accepted, dropped, zero errors either side — and
    // the previous config reproduces the Unimplemented under the same
    // harness.
    // ==================================================================
    otelcol.receiver.otlp "local" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }

      output {
{{- if .Values.betterstack.enabled }}
        // Traces have a real destination now (Better Stack). Logs and metrics
        // keep the drop chain: an app's OTLP logs duplicate its stdout, which
        // the logs pipeline above already ships, and its OTLP metrics duplicate
        // the scrape. Both stay WIRED to a live chain — see the block comment
        // above for what unwiring a signal costs.
        traces  = [otelcol.exporter.otlphttp.betterstack.input]
{{- else }}
        traces  = [otelcol.processor.filter.drop_all.input]
{{- end }}
        logs    = [otelcol.processor.filter.drop_all.input]
        metrics = [otelcol.processor.filter.drop_all.input]
      }
    }

    otelcol.processor.filter "drop_all" {
      error_mode = "ignore"

      traces {
        span = ["true"]
      }

      logs {
        log_record = ["true"]
      }

      metrics {
        metric = ["true"]
      }

      output {
        traces  = [otelcol.exporter.otlp.blackhole.input]
        logs    = [otelcol.exporter.otlp.blackhole.input]
        metrics = [otelcol.exporter.otlp.blackhole.input]
      }
    }

    // Unreachable by design (TCP discard port); receives nothing.
    otelcol.exporter.otlp "blackhole" {
      client {
        endpoint = "127.0.0.1:9"

        tls {
          insecure = true
        }
      }
    }
{{- if .Values.betterstack.enabled }}

    // ==================================================================
    // Better Stack Telemetry — this box's OWN source, reached directly.
    //
    // Both files come from Secret `betterstack-telemetry`, which is written
    // by apps/box/box-secrets from what central minted for this box.
    // They are NOT chart values
    // and NOT cloud-init: the token is per-box and rotatable, and the host is
    // per-source, so neither can live in a git-side values file that every box
    // shares.
    //
    // local.file polls, so a rotated token or a newly-appeared Secret takes
    // effect without restarting Alloy. That is what makes the volume's
    // `optional: true` (apps/box/observability/values.yaml) safe: a box whose
    // Secret has not landed yet picks it up on the next poll instead of
    // crashlooping.
    //
    // The token is written with `jq -je`, i.e. with NO trailing newline. A
    // newline here would be sent inside the Authorization header and fail
    // as a wrong token rather than as a malformed one.
    // ==================================================================
    local.file "betterstack_token" {
      filename  = "/etc/betterstack/token"
      is_secret = true
    }

    local.file "betterstack_host" {
      filename = "/etc/betterstack/host"
    }

    otelcol.auth.bearer "betterstack" {
      token = local.file.betterstack_token.content
    }

    // otlphttp appends the signal path itself (/v1/traces), so the endpoint is
    // the bare host — writing the path here yields /v1/traces/v1/traces.
    otelcol.exporter.otlphttp "betterstack" {
      client {
        endpoint    = "https://" + local.file.betterstack_host.content
        auth        = otelcol.auth.bearer.betterstack.handler
        compression = "gzip"
      }
    }

    // Logs reach the same exporter by way of a converter: the pipeline above is
    // Loki-native, and this turns those entries into OTLP log records. It is a
    // SECOND consumer on loki.process.pod_logs, not a replacement — the central
    // push is untouched, and the redaction stages run before the fan-out, so
    // nothing is scrubbed for one destination and not the other.
    otelcol.receiver.loki "betterstack" {
      output {
        logs = [otelcol.exporter.otlphttp.betterstack.input]
      }
    }
{{- end }}
