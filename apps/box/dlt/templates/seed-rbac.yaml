# RBAC for the seed Job (seed-job.yaml). Wave -2: must exist before the
# wave -1 hook pod starts, or the very first sync deadlocks waiting on a
# ServiceAccount that only a later wave would apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dlt-seed
  labels:
    app: dlt-seed
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dlt-seed
  labels:
    app: dlt-seed
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  # `get` is name-scoped; `create` cannot be (K8s RBAC limitation) but the
  # Job only ever creates dlt-git, transformations-git, pipelines-git and
  # dlt-age. gitea-secrets is read for the Gitea admin credentials (repo +
  # token seeding); dlt-oidc for the age-public-key deposit (step 4);
  # dlt-age to read the deposited public key back. Every Secret the Job
  # gets MUST be listed here: a missing name reads as "absent", which
  # rotates the Gitea token while the create fails on AlreadyExists — the
  # dead-token trap secret_absent guards against.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["gitea-secrets", "dlt-git", "transformations-git", "pipelines-git", "dlt-age", "dlt-oidc"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dlt-seed
  labels:
    app: dlt-seed
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dlt-seed
subjects:
  - kind: ServiceAccount
    name: dlt-seed
