# Single-replica dlt-worker on a local-path PVC. The shared path ran it on an
# emptyDir + snapshot-to-S3 sidecar; the box is single-node, so the PVC keeps
# /dlt-state across restarts and the same sidecar binary in GIT mode syncs it
# with the on-box Gitea repo (fairtier-admin/dlt): save = commit + plain
# push, sync = clean-only fast-forward pull — never force, never auto-merge
# (see values.yaml `git:`). The worker may write state.json mid-run, so an
# autosave can commit a transient snapshot; the post-run TriggerSnapshot
# (SNAPSHOT_URL) always lands the settled state on top, and the seeded
# .gitignore keeps the bulky run artifacts (load/, normalize/, trace.pickle)
# out of the repo entirely.
#
# Pipeline definitions ARE files (pipelines-as-files Phase 2): the worker
# schedules from /pipelines, a pull-only checkout of the Console-rendered
# fairtier-admin/pipelines repo, and owns last_run_at locally
# (scheduler.json in the state dir but gitignored — its per-run timestamp
# bump would otherwise be a valueless commit each run; PVC-only, rebuilt on
# restore). Source credentials are files too
# (Phase 3): central renders pipelines/<name>.credentials.age encrypted to
# this box's age public key, and the worker decrypts them with the dlt-age
# identity (AGE_KEY_FILE) — those win over the poll. The worker polls
# FAIRTIER_API_URL every tick, but only for Run-now triggers (plus the
# synthesized file_upload storage credentials, which have no row to render
# from; row-backed source credentials stopped riding the poll entirely when
# POLL_SOURCE_CREDENTIALS was flipped off, 2026-07-19) — an
# outage of whatever it polls degrades to no-history/no-triggers instead of
# stopping ingestion. That poll goes to the box's own workspace-api — since
# split Phase 4 there is nowhere else it could go, central having stopped
# serving the workspace plane at all.
# The poll presents a client-credentials token from the on-box Casdoor
# (Secret dlt-oidc, seeded by casdoor-seed) — the FairTier API trusts this
# box's issuer and binds the tenant slug from the issuer host. The same
# token authenticates the on-box Lakekeeper catalog (writer principal
# oidc~admin/dlt-worker, granted by the platform worker).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dlt-worker
  labels:
    app: dlt-worker
    tier: box
spec:
  serviceName: dlt-snapshot
  replicas: 1
  selector:
    matchLabels:
      app: dlt-worker
      tier: box
  template:
    metadata:
      labels:
        app: dlt-worker
        tier: box
    spec:
      # Shared-path parity: an in-flight pipeline run gets time to finish and
      # the sidecar does a final save on SIGTERM.
      terminationGracePeriodSeconds: 300
      # No container in this pod talks to the K8s API.
      automountServiceAccountToken: false
      # uid 1000 = the dlt user in ghcr.io/fairtier/dlt-worker (shared-path
      # parity); fsGroup makes the PVC writable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Open (or first time: adopt) /dlt-state as a clone of the on-box
        # Gitea repo and fast-forward it if clean. Adoption never discards a
        # local file — pre-existing content becomes uncommitted modifications
        # for the sidecar's next save.
        - name: git-restore
          image: {{ .Values.sidecarImage }}
          args: ["restore"]
          env:
            {{- include "dlt.gitEnv" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /dlt-state
        # Clone the Console-rendered pipeline definitions into the pod-local
        # emptyDir. Pull-only mirror of fairtier-admin/pipelines — tiny and
        # fully re-clonable from the on-box Gitea, hence no PVC.
        - name: pipelines-restore
          image: {{ .Values.sidecarImage }}
          args: ["restore"]
          env:
            {{- include "dlt.pipelinesGitEnv" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: pipelines
              mountPath: /pipelines
      containers:
        - name: dlt-worker
          image: {{ .Values.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CUSTOMER_SLUG
              value: {{ .Values.slug | quote }}
            # Where the worker reports runs and picks up Run-now triggers.
            #
            # workspacePlaneLocal points it at the box's own workspace-api
            # instead of central's tenant-facing mux — the moment the
            # phone-home dies and the box stops depending on central to run
            # its own pipelines (control-plane/workspace split Phase 3C).
            #
            # The `false` branch below is dead since split Phase 4: central
            # serves no worker RPCs, so it points at a 404. It is left in the
            # template rather than inlined because deleting it is a chart
            # change for no behavioural gain — the value is true everywhere,
            # and the ordering rule that used to govern it (never lead the
            # cutover marker, or the worker polls the box for Run-now triggers
            # the Console is still writing centrally) went with the marker.
            #
            # The box mux needs no scheme change: it speaks the same h2c the
            # worker already used, and accepts the same on-box Casdoor token
            # (it was designed for this in Phase 3A).
            - name: FAIRTIER_API_URL
              {{- if .Values.workspacePlaneLocal }}
              value: "http://workspace-api:8081"
              {{- else }}
              value: "https://worker-api.{{ .Values.baseDomain }}"
              {{- end }}
            - name: LAKEKEEPER_URL
              value: "http://lakekeeper:8181"
            - name: LAKEKEEPER_WAREHOUSE
              value: {{ .Values.warehouse | quote }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ .Values.pollIntervalSeconds | quote }}
            - name: DLT_STATE_DIR
              value: /dlt-state
            # Drop a load package's staged parquet once the package is fully
            # loaded. dlt's default is to KEEP it, forever, under
            # load/loaded/<load_id>/completed_jobs — so the PVC grows by one
            # full copy of every run's extracted data and never shrinks. That
            # is what filled a box's 38G disk (2026-08-10): 12 retained demo
            # packages at ~1.7G each = 16G on a PVC that requests 5Gi,
            # which local-path does not enforce. It is not a slow leak either
            # — a daily pipeline adds its package size per day.
            #
            # Disk is the wrong resource to run out of on a single-node box:
            # at 85% used the kubelet crosses its imagefs eviction threshold,
            # image GC finds nothing to free (every image is in use), and the
            # node flaps DiskPressure — which restarts EVERY pod on the box,
            # not just this one. Those restarts then kill lakekeeper/gitea
            # mid-load, the load fails "connection refused", the package is
            # left pending, and the next run stages another copy. The leak
            # feeds the outage that feeds the leak.
            #
            # The data itself is already in Iceberg; these are staging copies
            # kept only so `dlt pipeline info` can show history. The package
            # skeleton (schema + state) survives — only the bulk goes.
            - name: LOAD__DELETE_COMPLETED_JOBS
              value: "true"
            # Bounds DuckDB's buffer manager inside the dbt run child, which
            # otherwise sizes itself from the host's RAM rather than this
            # container's cgroup. This is what keeps the run under the memory
            # limit; the limit itself is only the backstop behind it. Full
            # derivation of the number in values.yaml (dbtDuckdbMemoryLimit).
            - name: DBT_DUCKDB_MEMORY_LIMIT
              value: {{ .Values.dbtDuckdbMemoryLimit | quote }}
            # Definitions + local scheduling from the checkout; the poll
            # carries only triggers, the last-run watermark and the
            # credentials no .age file covers (pipelines-as-files Phase 2).
            # Required by the worker since 0.9.0 — the Phase 2.5 cleanup
            # retired poll-is-truth, so there is no lever here any more.
            - name: PIPELINES_DIR
              value: /pipelines
            {{- if .Values.ageCredentials.enabled }}
            # Phase 3: decrypt pipelines/<name>.credentials.age from the
            # checkout with the box age identity (Secret dlt-age, seeded by
            # dlt-seed step 4). Flipping ageCredentials.enabled=false drops
            # this var and the worker ignores credential files (0.1.0
            # poll-credentials behavior) — the Phase-3 rollback lever.
            - name: AGE_KEY_FILE
              value: /age/key.txt
            {{- end }}
            # Post-run save hook into the snapshot sidecar below.
            - name: SNAPSHOT_URL
              value: "http://localhost:8484/snapshot.v1.SnapshotService/TriggerSnapshot"
            # The customer's R2 bucket — cloud-init stages these in
            # fairtier-storage; this worker is the Secret's first consumer. dlt's filesystem
            # destination writes the Iceberg data files directly.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: fairtier-storage
                  key: s3AccessKeyId
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fairtier-storage
                  key: s3SecretAccessKey
            - name: AWS_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: fairtier-storage
                  key: s3Endpoint
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: fairtier-storage
                  key: s3Region
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: fairtier-storage
                  key: s3Bucket
            # ONE client-credentials pair for both the Lakekeeper catalog and
            # the FairTier API bearer (dlt-worker convention). Minted on the
            # box by casdoor-seed (apps/box/casdoor/values.yaml, Secret
            # dlt-oidc). The PUBLIC auth hostname matters: Casdoor stamps its
            # origin as the token issuer, which is exactly what the FairTier API
            # binds the tenant from (hairpin precedented by oauth2-proxy,
            # gitea-init and duckflight).
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: dlt-oidc
                  key: client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dlt-oidc
                  key: client-secret
            - name: OIDC_TOKEN_URL
              value: "https://auth.customer-{{ .Values.slug }}.{{ .Values.baseDomain }}/api/login/oauth/access_token"
            # Hosted dbt transformations repo (seeded by dlt-seed alongside
            # the state repo): the worker clones it read-only when a
            # transformation config has no connected repo of its own, and
            # generates profiles.yml at run time — credentials never live in
            # the repo.
            - name: TRANSFORM_REPO_URL
              value: "http://gitea:3000/fairtier-admin/transformations.git"
            - name: TRANSFORM_GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: transformations-git
                  key: username
            - name: TRANSFORM_GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: transformations-git
                  key: token
            {{- if .Values.workspaceDb.enabled }}
            # Local-first run recording (control-plane/workspace-plane split
            # Phase 2E): the worker (>=0.4.0) records every pipeline /
            # transformation run in a box-local database first, then reports
            # to FAIRTIER_API_URL best-effort — run history survives the API
            # it reports to being unreachable. Unset = report-only (rollback
            # lever = workspaceDb.enabled). PGPASSWORD must precede
            # WORKSPACE_DB_URL so the k8s $(VAR) interpolation keeps the
            # password out of the rendered manifest (no plaintext secret in
            # git). Superuser for the MVP; a dedicated workspace_worker role
            # is a hardening follow-up.
            #
            # WHICH database follows workspacePlaneLocal, the same lever that
            # decides where the worker reports (Phase 3D):
            #
            #   local  → `workspace_api`, the database the box's own
            #            workspace-api serves the Console from. Both writers
            #            then land on ONE row, because the worker reports the
            #            id it recorded the run under and the API upserts on
            #            it (workspace-api >= 0.7.0, dlt-worker >= 0.5.0).
            #            Schema owned by that module's migrations.
            #   central → the standalone `workspace` database
            #            (apps/box/workspace-db), which nothing on the box
            #            reads: with the Console served centrally, the local
            #            row is a survivability backup, not the record.
            #
            # Pointing a NON-cut-over box at workspace_api would be wrong in
            # a quiet way: the Console would still read central, so the two
            # halves of one run would sit in different databases.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  # Written by cloud-init into fairtier-system.
                  name: postgres-credentials
                  key: postgres-password
            - name: WORKSPACE_DB_URL
              value: "postgres://postgres:$(PGPASSWORD)@{{ .Values.workspaceDb.host }}:{{ .Values.workspaceDb.port }}/{{ if .Values.workspacePlaneLocal }}{{ .Values.workspaceDb.localPlaneDatabase }}{{ else }}{{ .Values.workspaceDb.database }}{{ end }}?sslmode=disable"
            {{- end }}
          ports:
            - containerPort: 8080
              name: healthz
          volumeMounts:
            - name: state
              mountPath: /dlt-state
            # readOnly enforces the one-way flow: the worker reads
            # definitions, only the pipelines-sync sidecar writes here.
            - name: pipelines
              mountPath: /pipelines
              readOnly: true
            {{- if .Values.ageCredentials.enabled }}
            - name: age
              mountPath: /age
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
        # save/sync sidecar: the worker triggers a save after every
        # successful run (SNAPSHOT_URL above); autosave and the SIGTERM save
        # are the backstop. The sync loop fast-forwards remote edits
        # (break-glass state surgery in Gitea) back onto the PVC.
        # GET /debug/sync-status reports dirty/diverged.
        - name: snapshot
          image: {{ .Values.sidecarImage }}
          args: ["serve"]
          env:
            {{- include "dlt.gitEnv" . | nindent 12 }}
            - name: SYNC_INTERVAL
              value: {{ .Values.git.syncInterval | quote }}
            - name: AUTOSAVE_INTERVAL
              value: {{ .Values.git.autosaveInterval | quote }}
          ports:
            - containerPort: 8484
              name: snapshot
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /dlt-state
          resources:
            {{- toYaml .Values.sidecarResources | nindent 12 }}
          livenessProbe:
            grpc:
              port: 8484
            initialDelaySeconds: 10
            periodSeconds: 30
        # Pull-only sync for the pipelines checkout (rill viewer pattern):
        # AUTOSAVE_INTERVAL=0 disables save entirely — definitions flow one
        # way, Console → box; nothing on the box ever commits here.
        # LISTEN_ADDR moves the sidecar RPC off :8484, which the state
        # snapshot sidecar owns in this pod.
        - name: pipelines-sync
          image: {{ .Values.sidecarImage }}
          args: ["serve"]
          env:
            {{- include "dlt.pipelinesGitEnv" . | nindent 12 }}
            - name: SYNC_INTERVAL
              value: {{ .Values.pipelinesGit.syncInterval | quote }}
            - name: AUTOSAVE_INTERVAL
              value: "0"
            - name: LISTEN_ADDR
              value: ":8485"
          ports:
            - containerPort: 8485
              name: pipelines-sync
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: pipelines
              mountPath: /pipelines
          resources:
            {{- toYaml .Values.sidecarResources | nindent 12 }}
          livenessProbe:
            grpc:
              port: 8485
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        # The pipelines checkout is disposable (re-cloned by
        # pipelines-restore on every pod start) — unlike /dlt-state it
        # carries no machine-owned truth, so no PVC.
        - name: pipelines
          emptyDir: {}
        {{- if .Values.ageCredentials.enabled }}
        # The box age identity (dlt-seed step 4). optional: the pod must
        # schedule on a fresh box before the seed has ever run — the worker
        # then just falls back to poll credentials until the next restart.
        # 0440 (not 0400): secret files are root-owned with fsGroup as
        # group, so the worker (uid 1000, fsGroup 1000) reads via the group
        # bit.
        - name: age
          secret:
            secretName: dlt-age
            optional: true
            defaultMode: 0440
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        # No storageClassName: k3s default (local-path) — the box's own
        # disk, same durability story as the postgres/rill PVCs.
        resources:
          requests:
            storage: {{ .Values.storage.stateSize }}
