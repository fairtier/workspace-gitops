# slug + baseDomain are injected by the app-of-apps
# (apps/box/apps/templates/dlt.yaml); placeholders here.
slug: ""
baseDomain: "fairtier.com"

# 0.0.3 added the dbt transformation runner (git clone + dbt build +
# per-model run reporting); 0.0.4 runs dbt from a writable cwd (canary
# finding — DuckDB's iceberg extension mkdirs relative to cwd, /app is
# read-only); 0.0.5 added the google_sheets source; 0.0.6 adds filesystem
# tables mode (file drop). The (frozen) shared path stays on 0.0.2.
# No :latest.
# 0.0.7 bundles pandas so file-drop CSV/TSV actually parse (0.0.6 crashed on
# the live box with ModuleNotFoundError: pandas — dlt read_csv is pandas-based);
# 0.0.8 sets PYTHONUNBUFFERED=1 (hygiene); 0.0.9 is the real log-visibility fix:
# importing dlt pins the root logger to WARNING, so the worker's INFO logs
# (startup, "Running pipeline", outcomes) were dropped — only ERRORs reached
# Loki. 0.0.9 forces root logging back to INFO (basicConfig force=True).
# 0.1.0 adds files mode (pipelines-as-files Phase 2): with PIPELINES_DIR set
# the worker reads pipelines/*.yaml from the box checkout and schedules
# locally (scheduler.json in /dlt-state); the poll shrinks to triggers +
# credentials. 0.9.0 makes that the only mode — PIPELINES_DIR is required,
# GetPipelineConfigs no longer returns definition fields, and a Run-now
# fires on a disabled pipeline (Phase 2.5 cleanup).
# 0.2.0 adds age credentials (pipelines-as-files Phase 3): with AGE_KEY_FILE
# set the worker decrypts pipelines/<name>.credentials.age from the checkout
# (box-local age identity, Secret dlt-age) and those credentials win over the
# poll; it also ships `python -m dlt_worker.agekey`, the keypair generator
# the seed Job runs. AGE_KEY_FILE unset = exact 0.1.0 behavior (rollback
# lever = ageCredentials.enabled below).
# 0.2.3 streams the Iceberg load in 200k-row appends (scanner readahead=0);
# 0.2.4 caps extract/normalize parquet row groups (DATA_WRITER__ROW_GROUP_SIZE)
# so those stages are bounded too. 0.2.5 commits the streamed load every
# ICEBERG_LOAD_COMMIT_EVERY appends (default 20) and logs per-append RSS +
# timing. 0.2.6 fixes the `replace` disposition: it truncated the table in the
# same transaction as the streamed appends, which drove PyIceberg's
# copy-on-write delete path (loads the existing table into RAM) and OOM-killed
# the worker on the first append; now the truncate is its own committed
# transaction and the appends stream into the emptied table. 0.2.7 heals
# tables created by the pre-0.2.1 row-by-row normalize (required
# _dlt_load_id/_dlt_id the Arrow-native path never populates → PyIceberg
# rejected every append and dlt retry-slept on it near-silently): required
# columns missing from the incoming data are relaxed to optional before the
# append, and a schema rejection is now a terminal (visible) run failure.
# 0.2.8 turns off the parquet scanner's pre_buffer read cache, which retained
# column-chunk buffers until the fragment was exhausted — the Arrow pool grew
# toward the whole load-package file size (~4MB per 200k-row chunk) and killed
# the 41M-row run at chunk 100; with it off the pool stays flat at ~one batch.
# 0.2.9 teaches the google_sheets reader the OAuth ("Sign in with Google")
# credential shape ({client_id, client_secret, refresh_token}) alongside the
# existing service_account_key path — the FairTier API already serves it, the
# worker just never consumed it (every OAuth Sheets run failed with
# "source_credentials missing required 'service_account_key'").
# 0.3.0 runs each pipeline in a short-lived subprocess (PIPELINE_SUBPROCESS=1)
# so a big run's retained memory (Arrow buffers, dlt caches) is returned to the
# OS at process exit and an OOM kills the run, not the worker.
# 0.3.1 surfaces the Google Sheets API error body: a bad range (e.g. a tab name
# that doesn't exist) returned a bare "400 Bad Request for url: ..." because
# requests' raise_for_status() drops the JSON body; the run now fails with
# Google's message ("Unable to parse range: Sheet1!A1:D") + a tab-name hint.
# 0.4.0 adds local-first run recording (control-plane/workspace-plane split
# Phase 2D): with WORKSPACE_DB_URL set
# the worker records every pipeline/transformation run in the box-local
# `workspace` Postgres database first (shared run identity), then reports
# centrally best-effort (bounded-retry), plus a startup+hourly stuck-row
# sweep. WORKSPACE_DB_URL unset = exact 0.3.1 behavior, central-only reporting
# (rollback lever = workspaceDb.enabled below).
# 0.5.0 gives a run ONE identity (Phase 3D): the report now always carries the
# id the run was recorded under, not only for Run-now triggers, so the
# local-first write and the report converge on a single row instead of the API
# minting a second id for every scheduled run. That is what makes it safe to
# point WORKSPACE_DB_URL at the database the API itself serves — see
# workspaceDb below. **Pair it with workspace-api >= 0.7.0**, which upserts on
# the reported id; an older API answers ErrPipelineRunNotFound and drops the
# report. Also fixes three silent NOT NULL violations in the local writes
# (NULL where the column is NOT NULL DEFAULT, swallowed by a bare except, so
# a run went unrecorded) — never hit before, because nothing pre-existed the
# worker's own insert until this repoint.
# 0.6.0 reads named files from a public http(s) origin, with no credential
# and no directory listing — such hosts serve by key and refuse to list, and
# dlt's own filesystem source answers a glob there with ZERO ROWS AND NO
# ERROR. Used by the starter demo's public dataset bucket (workspace-api
# >= 0.8.0). s3:// sources are untouched.
# 0.6.1 re-opens the Iceberg table mid-load once its vended storage
# credentials go stale, so a multi-hour load can finish (see
# ICEBERG_CREDENTIAL_REFRESH_SECONDS below).
# 0.7.0 runs dbt transformations in the same subprocess as pipelines have
# used since 0.3.0. That was the last execution path still living in the
# long-lived worker, and on 2026-08-10 it left 800M anon behind after a
# build over the 85M-row demo table — under this container's 1Gi limit, so
# never OOM-killed, just held until the pod was restarted by hand while the
# box thrashed. Two more memory wins ride along: dlt and dbt are imported in
# the run child only (the poll loop idles at 49MB instead of 205MB), and the
# generated dbt profile bounds DuckDB (memory_limit 512MB, spill capped at
# 4GB inside the run's temp dir) so a big model spills instead of sizing its
# buffer manager from the whole box's RAM. Also the 0.7.0 OTel release:
# traces + metrics, inert unless an OTLP endpoint is configured.
# Rollback levers, in order of bluntness: TRANSFORMATION_SUBPROCESS=0,
# DBT_DUCKDB_MEMORY_LIMIT="" (restores DuckDB's own default), pin 0.6.1.
#
# 0.10.0 adds the `duckdb` source type — extraction through a DuckDB
# extension (mysql baked into the image), streaming Arrow batches into the
# normal load path with its own spill-not-shrink bounds
# (PIPELINE_DUCKDB_* knobs). Pairs with workspace-api 0.28.0, which is
# what accepts the type at save time; the worker may lead, never trail.
#
# 0.11.0 widens the baked set to mssql/firebird (ATTACH databases), pdf
# and webbed (query-only readers: read_pdf, read_html), and the httpfs
# autoload helper. Pairs with workspace-api 0.29.0 (allowlist parity).
#
# 0.12.0 drops firebird again (it was only the widening example; nobody
# needs it). Pairs with workspace-api 0.30.0.
#
# 0.13.0 moves the duckdb wheel to 1.5.5 and bakes gdrive — a gdrive://
# virtual filesystem so the readers (read_pdf, read_csv incl. native
# Sheets) pull straight from Google Drive with the customer's own OAuth
# client. Pairs with workspace-api 0.31.0.
#
# 0.15.0 (0.14.0 was never pinned, it is in here) does two things. A pipeline
# may LOAD more than one extension — `extensions: [gdrive, pdf]`, because a
# PDF in Google Drive is exactly two and one LOAD could never read it; the
# singular `extension` still works and is what everything else sends. And the
# worker now claims **source tests**: a queued probe from workspace-api
# 0.35.0, run in the same subprocess-per-run isolation an extraction gets, so
# a wrong password is discovered in the wizard rather than in the first
# scheduled run hours later. Pairs with workspace-api 0.35.0 (it queues them
# and serves `capabilities.testable_source_types`) and console 0.13.0 (it
# shows the card); the worker may lead, never trail.
image: ghcr.io/fairtier/dlt-worker:0.15.0
# kubectl + curl + jq + bash for the seed Job (github.com/alpine-docker/k8s).
seedImage: alpine/k8s:1.33.13
# Git-backed state persistence (SNAPSHOT_BACKEND=git): restore init container
# + save/sync sidecar. Same binary the (frozen) shared path runs in S3 mode.
# 0.2.0 adds an optional AUTH_TOKEN bearer gate (left unset here — this
# sidecar is pod-internal, unlike Rill's published one), 0.3.0 adds OTel
# traces + metrics over OTLP/HTTP, inert without an endpoint. 0.3.1 is a
# Go 1.27 rebuild with refreshed deps — no behaviour change.
sidecarImage: ghcr.io/fairtier/snapshot-sidecar:0.3.1

# Lakekeeper warehouse dlt writes to — box convention, same as DuckFlight and
# Rill (apps/box/duckflight/values.yaml iceberg.warehouse).
warehouse: default

# How often the worker polls the central API for pipeline configs/triggers.
pollIntervalSeconds: 60

# dlt's execution state (per-pipeline state.json + schemas) lives in an
# on-box Gitea repo; machine junk (trace.pickle, load/, normalize/) is
# gitignored there and stays on the PVC. sync = fast-forward pull only when
# the tree is clean; save = commit + plain push — never force, never
# auto-merge. A rejected push surfaces as status "remote_changed".
git:
  # fairtier-admin is the fixed Gitea admin the gitea seed creates
  # (apps/box/gitea/templates/seed-job.yaml); the dlt seed creates the repo
  # under it and mints the sidecar token (Secret dlt-git).
  remoteURL: http://gitea:3000/fairtier-admin/dlt.git
  branch: main
  # Remote edits are break-glass state surgery only — slow sync is fine.
  syncInterval: 5m
  # Belt only: the worker TriggerSnapshots after every successful run, so
  # autosave matters just for state the worker never settles (crashes).
  autosaveInterval: 5m

# Console-rendered pipeline definitions (pipelines-as-files Phase 2): the
# worker schedules from a pull-only checkout of this repo, cloned into an
# emptyDir by pipelines-restore and ff-pulled by the pipelines-sync sidecar.
# No longer optional — the `enabled` lever went with the Phase 2.5 cleanup,
# which retired the poll-is-truth mode it fell back to. The worker requires
# PIPELINES_DIR as of 0.9.0, and the poll can no longer serve a definition.
pipelinesGit:
  # Same fixed Gitea admin as `git:` above; repo created by the dlt seed
  # Job step 3, which also mints the read token (Secret pipelines-git).
  remoteURL: http://gitea:3000/fairtier-admin/pipelines.git
  branch: main
  # Deliberately faster than git.syncInterval (5m, sized for break-glass
  # state surgery): a Console schedule edit or post-create Run-now should
  # reach the box within about one poll tick (pollIntervalSeconds).
  syncInterval: 1m

# Age-encrypted source credentials in the pipelines checkout
# (pipelines-as-files Phase 3): the seed Job generates a box age keypair
# (Secret dlt-age, neither half leaves the box), and the box's own
# workspace-api reads the public half from that Secret and renders
# pipelines/<name>.credentials.age beside each definition. enabled=false is
# the rollback lever: drops AGE_KEY_FILE and the worker ignores credential
# files, reverting to poll-delivered credentials (0.1.0 behavior).
ageCredentials:
  enabled: true

# Point FAIRTIER_API_URL at the box's own workspace-api (:8081) instead of
# central's worker-api (control-plane/workspace split Phase 3C). This is what
# actually kills the phone-home: with it on, nothing about running this
# customer's pipelines depends on the central plane existing.
#
# **`false` no longer works, and the default flipped because of it (Phase 4,
# 2026-08-22).** Central serves no worker RPCs at all now — no
# GetPipelineConfigs, no ReportPipelineRun — so a worker pointed there polls a
# 404 and this is no longer a rollback lever but a broken configuration. The
# ordering hazard this comment used to document (repoint only after the
# customer's cutover marker is set, or the worker polls the box for Run-now
# triggers still being written centrally) is gone with the marker itself:
# there is no second plane for the Console to write them to.
workspacePlaneLocal: true

# Local-first run recording (control-plane/workspace-plane split, Phase 2E):
# with WORKSPACE_DB_URL set the worker (>=0.4.0) writes pipeline_runs /
# transformation_runs into a box-local Postgres database first, then reports
# to FAIRTIER_API_URL best-effort — so run history survives the API it reports
# to disappearing. enabled=false is the rollback lever: drops WORKSPACE_DB_URL
# and the worker reverts to report-only (0.3.1 behavior). Which database it
# writes to follows workspacePlaneLocal — see the two keys below. The worker
# NEVER migrates either schema; it writes explicit column lists, which is what
# makes it safe to point at a database another lineage owns.
workspaceDb:
  enabled: true
  # Box-local Postgres (same StatefulSet as gitea/casdoor/etc.). MVP uses the
  # superuser from the postgres-credentials Secret; a dedicated
  # workspace_worker role is a tracked hardening follow-up.
  host: postgresql.fairtier-system.svc.cluster.local
  port: 5432
  # Pre-cutover: the standalone store, schema owned by apps/box/workspace-db.
  # Nothing on the box reads it — with the Console served centrally it is a
  # survivability backup, and the run the customer SEES is the central row.
  database: workspace
  # Post-cutover (workspacePlaneLocal): the database the box's own
  # workspace-api serves the Console from, so the local-first write and the
  # report converge on ONE row instead of two stores that silently diverge.
  #
  # Safe because the worker never migrates — it writes explicit column lists
  # into a schema this module owns, so the two golang-migrate lineages that
  # must never share a `schema_migrations` still don't. The FK to `pipelines`
  # this database adds is satisfied by construction: the pipeline list the
  # worker polls comes from this very database.
  #
  # Needs workspace-api >= 0.7.0 AND dlt-worker >= 0.5.0 together: the worker
  # reports the id it recorded the run under, and the API upserts on it.
  # An older API would mint its own id for scheduled runs and the customer
  # would see every run twice.
  localPlaneDatabase: workspace_api

# Was shared-path parity (1Gi/256Mi) — pipeline runs normalize data in memory.
# **Parity is deliberately broken here since 2026-08-11.** The shared
# substrate is a multi-node cluster where a 1Gi limit costs nothing; a box is
# one 3.7Gi node where it is most of the spare RAM. Do not re-align these by
# copying the shared number back.
#
# The memory limit is NOT free headroom: it is bounded by what the node can
# actually honour. A 3.7Gi box has 2852Mi allocatable against 2382Mi of pod
# requests, so **470Mi** is all that is unspoken for. A limit above
# request+470Mi lets this container allocate memory the node does not have —
# and because the allocation stays under its own limit, no memcg OOM fires to
# contain it. The node hits a *global* OOM instead and the kernel picks a
# victim box-wide by oom_score, which in July reached CoreDNS and ArgoCD.
#
# That is exactly what happened on 2026-08-11 07:54:46 with the old 1Gi:
# the run child peaked at 925MB, ~800Mi over this container's request. The
# kubelet's eviction floor did not stop it — eviction runs on a housekeeping
# tick, not on the allocation path, so a fast allocator crosses the threshold
# and reaches OOM inside one interval.
#
# 640Mi keeps burst (640-224 = 416Mi) inside the 470Mi the node has spare.
# Raising it means freeing requests elsewhere first — check
# `kubectl describe node` Allocated-resources, do not just edit this number.
resources:
  requests:
    cpu: 100m
    memory: 224Mi
  limits:
    cpu: "1"
    memory: 640Mi

# What actually makes the run fit under that limit (the limit is only the
# backstop). DuckDB sizes its buffer manager from the HOST's RAM, not the
# cgroup, so left alone it would plan for ~2.8GB inside a 640Mi container.
# dlt-worker 0.7.0 bounds it, defaulting to 512MB — which still put the
# 2026-08-11 run child at 925MB peak, i.e. ~413MB of non-DuckDB overhead
# (dbt + pyarrow + the duckdb python module) on top of the cap.
#
# 192MB puts the projected peak at ~605MB, leaving real margin under 640Mi.
# Not 256MB: that projects to ~669MB and would be memcg-killed on the first
# big model. The cost is spilling, which is the intended lever — a big model
# spills to the run's temp dir and finishes slower, it does not fail.
#
# Watch the first NYC-Taxi-scale dbt build after this lands and re-derive the
# overhead figure from it; 413MB is one sample, not a measurement series.
# Empty string restores DuckDB's own default (the documented rollback lever,
# in order of bluntness: this, then TRANSFORMATION_SUBPROCESS=0, then 0.6.1).
dbtDuckdbMemoryLimit: 192MB

# git operations on state.json + schemas are cheap; rill sidecar parity.
sidecarResources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

storage:
  # /dlt-state on the k3s default local-path PVC. The committed content is
  # tiny (state.json + schemas), but load/ stages extracted parquet during
  # pipeline runs — size for the transient peak, not the git tree.
  #
  # "Transient" is load-bearing and was NOT true until 2026-08-10: dlt keeps
  # every completed load package's parquet forever, so the peak was really a
  # running total (16G of retained demo packages observed on this 5Gi
  # claim). LOAD__DELETE_COMPLETED_JOBS in the StatefulSet is what makes the
  # word honest. Note local-path enforces no quota — this number documents
  # the intent, it does not cap anything, so the backstop is the config knob
  # and not the claim size.
  stateSize: 5Gi
